                      if (pi.hProcess != IntPtr.Zero && !assigned) TerminateProcess(pi.hProcess, 1);
                      owned.Dispose();
                      throw;
                  }
                  finally
                  {
                      if (pi.hThread != IntPtr.Zero) CloseHandle(pi.hThread);
                  }
              }

              public bool Wait(int milliseconds)
