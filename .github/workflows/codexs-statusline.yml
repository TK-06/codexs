                  public string lpDesktop;
                  public string lpTitle;
                  public uint dwX;
                  public uint dwY;
                  public uint dwXSize;
                  public uint dwYSize;
                  public uint dwXCountChars;
                  public uint dwYCountChars;
                  public uint dwFillAttribute;
                  public uint dwFlags;
                  public ushort wShowWindow;
                  public ushort cbReserved2;
                  public IntPtr lpReserved2;
                  public IntPtr hStdInput;
                  public IntPtr hStdOutput;
                  public IntPtr hStdError;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION
              {
                  public IntPtr hProcess;
                  public IntPtr hThread;
                  public uint dwProcessId;
                  public uint dwThreadId;
              }

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern IntPtr CreateJobObject(IntPtr attributes, string name);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool SetInformationJobObject(IntPtr job, int infoClass, ref JOBOBJECT_EXTENDED_LIMIT_INFORMATION info, int length);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, EntryPoint = "CreateProcessW")]
              static extern bool CreateProcess(string application, StringBuilder commandLine, IntPtr processAttributes, IntPtr threadAttributes,
                  bool inheritHandles, uint flags, IntPtr environment, string currentDirectory, ref STARTUPINFO startup, out PROCESS_INFORMATION information);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool AssignProcessToJobObject(IntPtr job, IntPtr process);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint ResumeThread(IntPtr thread);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool TerminateProcess(IntPtr process, uint exitCode);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool CloseHandle(IntPtr handle);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint WaitForSingleObject(IntPtr handle, uint milliseconds);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool QueryInformationJobObject(IntPtr job, int infoClass, IntPtr buffer, int length, out int returned);

              static Exception Win32(string operation)
              {
                  return new Win32Exception(Marshal.GetLastWin32Error(), operation);
              }

              public static CodexsOwnedJob Start(string application, string commandLine, string directory)
              {
                  var owned = new CodexsOwnedJob();
                  PROCESS_INFORMATION pi = new PROCESS_INFORMATION();
                  bool assigned = false;
                  try
                  {
                      owned.job = CreateJobObject(IntPtr.Zero, null);
                      if (owned.job == IntPtr.Zero) throw Win32("CreateJobObject");
                      var limits = new JOBOBJECT_EXTENDED_LIMIT_INFORMATION();
                      limits.BasicLimitInformation.LimitFlags = JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE;
                      if (!SetInformationJobObject(owned.job, 9, ref limits, Marshal.SizeOf(typeof(JOBOBJECT_EXTENDED_LIMIT_INFORMATION))))
                          throw Win32("SetInformationJobObject(KILL_ON_JOB_CLOSE)");
                      var startup = new STARTUPINFO();
                      startup.cb = (uint)Marshal.SizeOf(typeof(STARTUPINFO));
                      if (!CreateProcess(application, new StringBuilder(commandLine), IntPtr.Zero, IntPtr.Zero, false,
                          CREATE_SUSPENDED | CREATE_NO_WINDOW, IntPtr.Zero, directory, ref startup, out pi))
                          throw Win32("CreateProcess suspended");
                      owned.process = pi.hProcess;
                      owned.ProcessId = checked((int)pi.dwProcessId);
                      if (!AssignProcessToJobObject(owned.job, pi.hProcess)) throw Win32("AssignProcessToJobObject");
                      assigned = true;
                      if (ResumeThread(pi.hThread) == uint.MaxValue) throw Win32("ResumeThread");
                      return owned;
                  }
                  catch
