        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: codexs-windows-cargo-1.95.0-${{ hashFiles('codex-rs/Cargo.lock') }}

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-statusline-${{ matrix.scope }}-${{ steps.scope.outputs.artifact_suffix }}
          path: ${{ env.CODEXS_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cargo timing reports
        if: always() && env.CARGO_TARGET_DIR != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-timings-${{ matrix.scope }}-${{ steps.scope.outputs.artifact_suffix }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload optional codex CLI binary
        if: success() && steps.scope.outputs.scope == 'build'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-cli-${{ steps.scope.outputs.artifact_suffix }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/codex.exe
          if-no-files-found: error
          retention-days: 7
