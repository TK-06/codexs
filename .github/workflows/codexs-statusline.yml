name: codexs status line (Windows)

on:
  push:
    branches: [statusline-command]
    paths:
      - .github/workflows/codexs-statusline.yml
      - codex-rs/**
      - codexs/**
  workflow_dispatch:
    inputs:
      scope:
        description: 'triage-current checks current source; triage compares with baseline; integration runs full/baseline/build'
        required: true
        type: choice
        default: feature
        options: [feature, full, baseline, build, integration, triage, triage-current]

permissions:
  contents: read

concurrency:
  group: codexs-statusline-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'feature' || inputs.scope }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    name: Resolve execution plan
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scopes.outputs.matrix }}
    steps:
      - name: Resolve execution scopes
        id: scopes
        shell: powershell
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $scopes = @('feature') }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:REQUESTED_SCOPE -ceq 'integration') { $scopes = @('full', 'baseline', 'build') }
            elseif ($env:REQUESTED_SCOPE -ceq 'triage') { $scopes = @('triage-full', 'triage-baseline') }
            elseif ($env:REQUESTED_SCOPE -ceq 'triage-current') { $scopes = @('triage-full') }
            elseif ($env:REQUESTED_SCOPE -cin @('feature', 'full', 'baseline', 'build')) { $scopes = @($env:REQUESTED_SCOPE) }
            else { throw "Unsupported scope: $env:REQUESTED_SCOPE" }
          } else { throw "Unsupported event: $env:GITHUB_EVENT_NAME" }
          $matrix = @{ scope=$scopes } | ConvertTo-Json -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

  quick_checks:
    name: Quick workflow and status-line formatting checks
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout current source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify quick-check GitHub exit boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath '.github/workflows/codexs-statusline.yml' -Raw
          $match = [regex]::Match($workflow, '(?ms)^      - name: Verify workflow behavior without compiling Rust\r?\n        run: \|\r?\n(?<code>.*?)(?=^      - name: |\z)')
          if (-not $match.Success) { throw 'Cannot locate quick-check script for exit-boundary test' }
          $body = [regex]::Replace($match.Groups['code'].Value, '(?m)^          ', '')
          $probeRoot = Join-Path ([System.IO.Path]::GetTempPath()) ('codexs-ci-exit-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          try {
            $env:CODEXS_STEP_EXIT_SCRIPT = Join-Path $probeRoot 'github-step.ps1'
            # Reproduce actions/runner ScriptHandlerHelpers.FixUpScriptContents.
            $wrapped = "`$ErrorActionPreference = 'stop'`n" + $body + "`nif ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit `$LASTEXITCODE }"
            [System.IO.File]::WriteAllText($env:CODEXS_STEP_EXIT_SCRIPT, $wrapped, [System.Text.UTF8Encoding]::new($false))
            & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -Command '& ([scriptblock]::Create([System.IO.File]::ReadAllText($env:CODEXS_STEP_EXIT_SCRIPT)))'
            $stepExit = $LASTEXITCODE
            if ($stepExit -ne 0) { throw "Quick checks returned process exit $stepExit after expected negative native probes" }
            Write-Host 'PASS successful quick checks return process exit 0 through GitHub wrapper'
          } finally {
            $resolvedProbe = [System.IO.Path]::GetFullPath($probeRoot)
            $resolvedTemp = [System.IO.Path]::GetFullPath([System.IO.Path]::GetTempPath()).TrimEnd('\') + '\'
            if (-not $resolvedProbe.StartsWith($resolvedTemp, [StringComparison]::OrdinalIgnoreCase) -or
                [System.IO.Path]::GetFileName($resolvedProbe) -notmatch '^codexs-ci-exit-[0-9a-f]{32}$') { throw 'Unsafe exit-probe cleanup path' }
            Remove-Item -LiteralPath $resolvedProbe -Recurse -Force -ErrorAction Stop
          }

      - name: Verify workflow behavior without compiling Rust
        run: |
          $WorkflowPath = Join-Path (Get-Location) '.github/workflows/codexs-statusline.yml'
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath $WorkflowPath -Raw
          $probeRoot = Join-Path ([System.IO.Path]::GetTempPath()) ('codexs-ci-probe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          $result = @{ passed=0; failures=[System.Collections.Generic.List[string]]::new() }
          try {
          function StepScript([string]$name) {
              foreach ($match in [regex]::Matches($workflow, '(?ms)^      - name: (?<name>[^\r\n]+)\r?\n(?<body>.*?)(?=^      - name: |\z)')) {
                  if ($match.Groups['name'].Value.Trim() -cne $name) { continue }
                  $script = [regex]::Match($match.Groups['body'].Value, '(?m)^        run: \|\r?\n(?<script>(?:^          [^\r\n]*(?:\r?\n|$)|^\r?\n)+)')
                  if ($script.Success) { return ([regex]::Replace($script.Groups['script'].Value, '(?m)^          ', '')) }
              }
              return $null
          }
          function Check([string]$name, [scriptblock]$body) {
              try { & $body; $result.passed++; Write-Host "PASS $name" }
              catch { $result.failures.Add("$name`: $($_.Exception.Message)"); Write-Host "FAIL $name`: $($_.Exception.Message)" }
          }
          function Equal($actual, $expected) {
              if (($actual -join "`n") -cne ($expected -join "`n")) { throw "expected [$($expected -join ', ')] but got [$($actual -join ', ')]" }
          }
          # Break caught: a push inherits a manual request, integration loses a scope,
          # or invalid manual input reaches a native runner. Execute the real selector.
          $selector = StepScript 'Resolve execution scopes'
          if (-not $selector) { $selector = StepScript 'Select validated scope' }
          foreach ($case in @(
              @{name='push always selects feature'; event='push'; request='integration'; want=@('feature')},
              @{name='manual feature'; event='workflow_dispatch'; request='feature'; want=@('feature')},
              @{name='manual full'; event='workflow_dispatch'; request='full'; want=@('full')},
              @{name='manual baseline'; event='workflow_dispatch'; request='baseline'; want=@('baseline')},
              @{name='manual build'; event='workflow_dispatch'; request='build'; want=@('build')},
              @{name='triage-current checks only the current revision'; event='workflow_dispatch'; request='triage-current'; want=@('triage-full')},
              @{name='triage compares both revisions serially'; event='workflow_dispatch'; request='triage'; want=@('triage-full','triage-baseline')},
              @{name='integration expands three independent scopes'; event='workflow_dispatch'; request='integration'; want=@('full','baseline','build')}
          )) {
              Check $case.name {
                  $env:GITHUB_EVENT_NAME = $case.event
                  $env:REQUESTED_SCOPE = $case.request
                  $env:RUNNER_TEMP = $probeRoot
                  $env:GITHUB_RUN_ID = 'synthetic-run'
                  $env:GITHUB_RUN_ATTEMPT = [guid]::NewGuid().ToString('N')
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.output')
                  $env:GITHUB_ENV = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.env')
                  try { & ([scriptblock]::Create($selector)) | Out-Null } catch { throw "selector rejected valid input: $($_.Exception.Message)" }
                  $output = @(Get-Content -LiteralPath $env:GITHUB_OUTPUT -ErrorAction SilentlyContinue)
                  $matrix = @($output | Where-Object { $_.StartsWith('matrix=') })
                  if ($matrix.Count -ne 1) { throw 'selector did not emit one runnable matrix' }
                  Equal @(($matrix[0].Substring(7) | ConvertFrom-Json).scope) $case.want
              }
          }
          foreach ($request in @('', 'unknown', 'feature,build', '../baseline')) {
              Check "invalid request [$request] fails closed" {
                  $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
                  $env:REQUESTED_SCOPE = $request
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ([guid]::NewGuid().ToString('N') + '.output')
                  $rejected = $false
                  try { & ([scriptblock]::Create($selector)) | Out-Null } catch { $rejected = $true }
                  Equal $rejected $true
                  Equal (Test-Path -LiteralPath $env:GITHUB_OUTPUT) $false
              }
          }
          # Break caught: two matrix scopes write to the same log directory.
          $selection = StepScript 'Select validated scope'
          Check 'matrix scopes produce separate log directories' {
              $paths = @()
              foreach ($scope in @('full','baseline','build','triage-full','triage-baseline')) {
                  $env:MATRIX_SCOPE = $scope
                  $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
                  $env:REQUESTED_SCOPE = $scope
                  $env:GITHUB_RUN_ID = 'synthetic-matrix'
                  $env:GITHUB_RUN_ATTEMPT = '1'
                  $env:RUNNER_TEMP = $probeRoot
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ($scope + '.output')
                  $env:GITHUB_ENV = Join-Path $probeRoot ($scope + '.env')
                  & ([scriptblock]::Create($selection)) | Out-Null
                  $entry = Get-Content -LiteralPath $env:GITHUB_ENV | Where-Object { $_.StartsWith('CODEXS_LOG_DIR=') }
                  $paths += $entry.Substring(15)
              }
              Equal @($paths | Select-Object -Unique).Count 5
          }
          # Only the expensive external Rust compiler is replaced. The real runner
          # resolves a native executable, passes arguments, captures output and exits.
          $fakeBin = Join-Path $probeRoot 'native'
          New-Item -ItemType Directory -Path $fakeBin | Out-Null
          $fakeExe = Join-Path $fakeBin 'rustup.exe'
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          public static class CodexsCargoBoundaryProbe {
              public static int Main(string[] args) {
                  File.WriteAllLines(Environment.GetEnvironmentVariable("CODEXS_PROBE_ARGS"), args);
                  Console.WriteLine("synthetic native boundary probe (no Rust build)");
                  return int.Parse(Environment.GetEnvironmentVariable("CODEXS_PROBE_EXIT"));
              }
          }
          '@ -OutputAssembly $fakeExe -OutputType ConsoleApplication
          $env:PATH = $fakeBin + ';' + $env:PATH
          if ((Get-Command rustup.exe -ErrorAction Stop).Source -cne $fakeExe) { throw 'Native probe executable did not resolve; refusing to run Rust' }
          $native = StepScript 'Run guarded native Cargo operation'
          $runner = [regex]::Match($native, '(?ms)^\$runnerSource = @''\r?\n(?<source>.*?)^''@').Groups['source'].Value
          $triageArgs = @(
              'run','1.95.0','cargo','test','--release','--locked','-p','codex-tui',
              '--config','profile.release.package.codex-tui.opt-level=1','--timings',
              '--lib','--','--exact','--test-threads=1',
              'app::tests::backend_banner_fallback_tests::backend_banner_fallback_uses_current_task_and_accepted_generation',
              'app::tests::backend_banner_fallback_tests::backend_banner_fallback_updates_task_settings_and_keeps_notice',
              'app::tests::luna_reserve_recovery_tests::luna_reserve_recovery_does_not_override_manual_choice_or_account_change',
              'app::tests::luna_reserve_recovery_tests::luna_reserve_recovery_requires_permission_and_no_remaining_blocker',
              'app::tests::session_lifecycle_requests::startup_defaults_tests::fresh_startup_falls_back_only_for_unsupported_config_read',
              'app::tests::session_lifecycle_requests::startup_defaults_tests::startup_reads_server_defaults_before_starting_thread',
              'app::owned_transcript::tests::fullscreen_composer_remote_images_leave_an_editable_prompt_row',
              'app::owned_transcript::tests::older_page_loading_uses_the_status_row_without_moving_content_or_cursor',
              'app::owned_transcript::tests::owned_transcript_reserves_a_row_above_the_composer',
              'app::owned_transcript::tests::recap_spacing_belongs_to_the_transcript_tail',
              'app::turn_tips::tests::turn_tip_placements_and_completion_barrier'
          )
          foreach ($case in @(
              @{scope='feature'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--lib','status_line_command')},
              @{scope='full'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--no-fail-fast')},
              @{scope='baseline'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--no-fail-fast')},
              @{scope='triage-full'; want=$triageArgs},
              @{scope='triage-baseline'; want=$triageArgs},
              @{scope='build'; want=@('run','1.95.0','cargo','build','--release','--locked','-p','codex-cli','--bin','codex','--timings')}
          )) {
              foreach ($nativeExit in @(0,101)) {
                  Check "$($case.scope) passes intended Cargo args and preserves exit $nativeExit" {
                      $id = [guid]::NewGuid().ToString('N')
                      $env:CODEXS_PROBE_ARGS = Join-Path $probeRoot ($id + '.args')
                      $env:CODEXS_PROBE_EXIT = "$nativeExit"
                      $statePath = Join-Path $probeRoot ($id + '.json')
                      $state = @{
                          workdir=$probeRoot; scope=$case.scope; source_sha=('a' * 40)
                          cargo_log=(Join-Path $probeRoot ($id + '.log'))
                          native_exit=(Join-Path $probeRoot ($id + '.exit'))
                          runner_error=(Join-Path $probeRoot ($id + '.error'))
                      }
                      $state | ConvertTo-Json | Out-File -LiteralPath $statePath -Encoding utf8
                      $env:CODEXS_GUARD_STATE = $statePath
                      $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes("`$ProgressPreference = 'SilentlyContinue'`n" + $runner))
                      & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -EncodedCommand $encoded > $null 2> (Join-Path $probeRoot ($id + '.stderr'))
                      $exitCode = $LASTEXITCODE
                      Equal $exitCode $nativeExit
                      Equal (Get-Content -LiteralPath $state.native_exit) "$nativeExit"
                      Equal @(Get-Content -LiteralPath $env:CODEXS_PROBE_ARGS) $case.want
                  }
              }
          }
          # Execute the real result boundary: a partial exact-name selection must not go green.
          $summary = $native.Substring($native.IndexOf('$lines = if (Test-Path -LiteralPath $outPath)'))
          foreach ($scope in @('triage-full','triage-baseline')) {
              foreach ($count in @(0,10,11,12)) {
                  Check "$scope requires all eleven diagnostic tests (observed $count)" {
                      $id = [guid]::NewGuid().ToString('N')
                      $outPath = Join-Path $probeRoot ($id + '.log')
                      $exitPath = Join-Path $probeRoot ($id + '.exit')
                      $stopPath = Join-Path $probeRoot ($id + '.stop')
                      $resultPath = Join-Path $probeRoot ($id + '.outcome')
                      $wrapperProblem = $null
                      $env:CODEXS_SCOPE = $scope
                      $env:CODEXS_SOURCE_SHA = 'a' * 40
                      $env:GITHUB_STEP_SUMMARY = ''
                      "test result: ok. $count passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s" | Out-File -LiteralPath $outPath -Encoding utf8
                      '0' | Out-File -LiteralPath $exitPath -Encoding ascii
                      $rejected = $false
                      try { & ([scriptblock]::Create($summary)) | Out-Null } catch { $rejected = $true }
                      Equal $rejected ($count -ne 11)
                  }
              }
          }
          } finally {
          $resolvedProbe = [System.IO.Path]::GetFullPath($probeRoot)
          $resolvedTemp = [System.IO.Path]::GetFullPath([System.IO.Path]::GetTempPath()).TrimEnd('\') + '\'
          if (-not $resolvedProbe.StartsWith($resolvedTemp, [StringComparison]::OrdinalIgnoreCase) -or
              [System.IO.Path]::GetFileName($resolvedProbe) -notmatch '^codexs-ci-probe-[0-9a-f]{32}$') { throw 'Unsafe probe cleanup path' }
          Remove-Item -LiteralPath $resolvedProbe -Recurse -Force -ErrorAction Stop
          }
          Write-Host "RESULT passed=$($result.passed) failed=$($result.failures.Count)"
          if ($result.failures.Count) { throw ($result.failures -join "`n") }
          # Expected nonzero probe exits have been checked; do not leak one to GitHub's shell epilogue.
          exit 0

      - name: Check status-line Rust formatting
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tui/src/status_line_command.rs',
            'tui/src/status_line_command_tests.rs',
            'tui/src/chatwidget/status_line_command_glue.rs',
            'tui/src/chatwidget/status_line_command_integration_tests.rs'
          ) | Where-Object { Test-Path -LiteralPath $_ }
          if (@($files).Count -eq 0) { throw 'No status-line source files found' }
          & rustup run 1.95.0 rustfmt --edition 2024 --check @files
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { throw "Status-line formatting failed: $nativeExit" }

  windows:
    name: Windows (${{ matrix.scope }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      INSTA_UPDATE: 'no'
      CARGO_TERM_COLOR: 'never'
    steps:
      - name: Select validated scope
        id: scope
        env:
          MATRIX_SCOPE: ${{ matrix.scope }}
        run: |
          $scope = $env:MATRIX_SCOPE
          if ($scope -cnotin @('feature', 'full', 'baseline', 'build', 'triage-full', 'triage-baseline')) { throw "Unsupported scope: $scope" }
          $logDir = Join-Path $env:RUNNER_TEMP "codexs-statusline-$scope-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $logDir -ErrorAction Stop | Out-Null
          "scope=$scope" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "CODEXS_SCOPE=$scope" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "CODEXS_LOG_DIR=$logDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ (steps.scope.outputs.scope == 'baseline' || steps.scope.outputs.scope == 'triage-baseline') && '1ee2374c675b1aeae8ca76e1c6c75a6a62619f8e' || github.sha }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Restore Cargo downloads only
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codexs-windows-cargo-1.95.0-${{ hashFiles('codex-rs/Cargo.lock') }}

      - name: Verify source and select target drive
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $logDir = [System.IO.Path]::GetFullPath($env:CODEXS_LOG_DIR)
          $setupLog = Join-Path $logDir 'setup.log'
          "preflight_started scope=$env:CODEXS_SCOPE" | Out-File -LiteralPath $setupLog -Encoding utf8
          try {
            $sha = (& git rev-parse HEAD).Trim()
            $gitExit = $LASTEXITCODE
            if ($gitExit -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot verify source SHA' }
            if ($env:CODEXS_SCOPE -cin @('baseline','triage-baseline') -and $sha -cne '1ee2374c675b1aeae8ca76e1c6c75a6a62619f8e') { throw "Wrong baseline source: $sha" }
            $workspaceVersion = Select-String -LiteralPath Cargo.toml -Pattern '^version = "0\.162\.1"$' | Select-Object -First 1
            if (-not $workspaceVersion) { throw 'Unexpected Codex workspace version' }
            $toolchain = Get-Content -LiteralPath rust-toolchain.toml -Raw
            $pinLines = @($toolchain -split '\r?\n' | Where-Object { $_ -cmatch '^\s*channel\s*=' })
            if ($pinLines.Count -ne 1 -or $pinLines[0] -cnotmatch '^\s*channel\s*=\s*"1\.95\.0"\s*$') { throw 'Unexpected source Rust pin' }
            $rustVersion = & rustup run 1.95.0 rustc --version
            $rustExit = $LASTEXITCODE
            if ($rustExit -ne 0 -or $rustVersion -notmatch '^rustc 1\.95\.0 ') { throw "Wrong Rust toolchain: $rustVersion (exit $rustExit)" }
            $drives = @([System.IO.DriveInfo]::GetDrives() | Where-Object { $_.DriveType -eq 'Fixed' -and $_.IsReady } | Sort-Object AvailableFreeSpace -Descending)
            if ($drives.Count -eq 0) { throw 'No readable fixed target drive' }
            $best = $drives[0]
            $target = Join-Path $best.RootDirectory.FullName "codexs-target-$env:CODEXS_SCOPE-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $target = [System.IO.Path]::GetFullPath($target)
            if ([System.IO.Path]::GetPathRoot($target) -cne $best.RootDirectory.FullName -or (Test-Path -LiteralPath $target)) { throw 'Target directory is not unique or on selected drive' }
            New-Item -ItemType Directory -Path $target -ErrorAction Stop | Out-Null
            "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CODEXS_SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            "source=$sha scope=$env:CODEXS_SCOPE rust=$rustVersion target=$target" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append
            foreach ($drive in $drives) { "drive=$($drive.Name) available_bytes=$($drive.AvailableFreeSpace)" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append }
          } catch {
            "PREFLIGHT_FAILED $($_.Exception.Message)" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append
            throw
          }

      - name: Run guarded native Cargo operation
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CODEXS_SCOPE -cnotin @('feature', 'full', 'baseline', 'build', 'triage-full', 'triage-baseline')) { throw 'Invalid scope from selection step' }
          $logDir = [System.IO.Path]::GetFullPath($env:CODEXS_LOG_DIR)
          $guardPath = Join-Path $logDir 'resource-guard.ps1'
          $runnerPath = Join-Path $logDir 'cargo-runner.ps1'
          $statePath = Join-Path $logDir 'guard-state.json'
          $guardLog = Join-Path $logDir 'guard.log'
          $readyPath = Join-Path $logDir 'guard.ready'
          $requestPath = Join-Path $logDir 'start.request'
          $startedPath = Join-Path $logDir 'runner.started'
          $donePath = Join-Path $logDir 'guard.done'
          $stopPath = Join-Path $logDir 'guard.stop'
          $outPath = Join-Path $logDir 'cargo.log'
          $exitPath = Join-Path $logDir 'native-exit.txt'
          $resultPath = Join-Path $logDir 'outcome.txt'
          $runnerSource = @'
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath $env:CODEXS_GUARD_STATE -Raw | ConvertFrom-Json
          try {
            Set-Location -LiteralPath $state.workdir
            [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
            $OutputEncoding = [Console]::OutputEncoding
            $rustup = (Get-Command rustup.exe -ErrorAction Stop).Source
            $cargoArgs = @('run', '1.95.0', 'cargo')
            if ($state.scope -eq 'build') {
              $cargoArgs += @('build', '--release', '--locked', '-p', 'codex-cli', '--bin', 'codex', '--timings')
            } else {
              $cargoArgs += @('test', '--release', '--locked', '-p', 'codex-tui', '--config', 'profile.release.package.codex-tui.opt-level=1', '--timings')
              if ($state.scope -eq 'feature') { $cargoArgs += @('--lib', 'status_line_command') }
              elseif ($state.scope -cin @('triage-full','triage-baseline')) {
                $env:RUST_BACKTRACE = '1'
                $cargoArgs += @(
                  '--lib','--','--exact','--test-threads=1',
