                              int count = Marshal.ReadInt32(buffer, 4);
                              var ids = new List<int>();
                              for (int i = 0; i < count; i++) ids.Add(Marshal.ReadIntPtr(buffer, 8 + i * IntPtr.Size).ToInt32());
                              return ids.ToArray();
                          }
                          if (Marshal.GetLastWin32Error() != 234) throw Win32("QueryInformationJobObject");
                      }
                      finally { Marshal.FreeHGlobal(buffer); }
                      capacity *= 2;
                  }
                  throw new InvalidOperationException("Job member list exceeds 4096 processes");
              }

              public void Dispose()
              {
                  if (job != IntPtr.Zero) { CloseHandle(job); job = IntPtr.Zero; }
                  if (process != IntPtr.Zero) { CloseHandle(process); process = IntPtr.Zero; }
              }
          }
