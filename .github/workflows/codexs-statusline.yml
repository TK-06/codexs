name: codexs status line (Windows)

on:
  push:
    branches: [statusline-command]
    paths:
      - .github/workflows/codexs-statusline.yml
      - codex-rs/**
      - codexs/**
  workflow_dispatch:
    inputs:
      scope:
        description: 'cleanup-red: full/config/config-baseline; cleanup: full/config/build; integration: full/baseline/build'
        required: true
        type: choice
        default: feature
        options: [feature, full, baseline, build, integration, triage, triage-current, config, config-baseline, cleanup-red, cleanup, formatter, bundle, evidence]
      candidate_sha:
        description: 'Optional immutable candidate SHA for explicit release validation'
        required: false
        type: string
        default: ''
      baseline_sha:
        description: 'Required with candidate_sha: immutable upstream baseline SHA'
        required: false
        type: string
        default: ''
      validation_id:
        description: 'Required with candidate_sha: unique invocation label'
        required: false
        type: string
        default: ''
      formatter_sha:
        description: 'Required for formatter/bundle/evidence: immutable formatter source SHA'
        required: false
        type: string
        default: ''
      formatter_version:
        description: 'Required for formatter/bundle/evidence: pinned formatter package version'
        required: false
        type: string
        default: ''
      source_version:
        description: 'Required for formatter/bundle/evidence: stable native source version'
        required: false
        type: string
        default: ''
      product_version:
        description: 'Stable codexs product version for bundle acceptance'
        required: false
        type: string
        default: '1.0.0'
      evidence_request:
        description: 'Bundle/evidence only: bounded JSON with completed run locators and distribution artifact IDs'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
      scope:
        required: true
        type: string
      validation_id:
        required: true
        type: string
      formatter_sha:
        required: false
        type: string
        default: ''
      formatter_version:
        required: false
        type: string
        default: ''
      source_version:
        required: false
        type: string
        default: ''
      product_version:
        required: false
        type: string
        default: '1.0.0'
      evidence_request:
        required: false
        type: string
        default: ''
    outputs:
      validation_summary:
        description: 'Evidence locator only; suite outcomes must be collected and verified separately'
        value: ${{ jobs.plan.outputs.validation_summary }}

permissions:
  contents: read

concurrency:
  group: codexs-statusline-${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation_id || (github.event_name == 'push' && 'feature' || inputs.scope) }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' && !inputs.candidate_sha }}

jobs:
  plan:
    name: Resolve execution plan
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scopes.outputs.matrix }}
      candidate_sha: ${{ steps.scopes.outputs.candidate_sha }}
      native_required: ${{ steps.scopes.outputs.native_required }}
      validation_summary: ${{ steps.scopes.outputs.validation_summary }}
    steps:
      - name: Resolve execution scopes
        id: scopes
        shell: powershell
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
          CALLER_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CALLER_BASELINE_SHA: ${{ inputs.baseline_sha }}
          CALLER_VALIDATION_ID: ${{ inputs.validation_id }}
          CALLER_FORMATTER_SHA: ${{ inputs.formatter_sha }}
          CALLER_FORMATTER_VERSION: ${{ inputs.formatter_version }}
          CALLER_SOURCE_VERSION: ${{ inputs.source_version }}
          CALLER_PRODUCT_VERSION: ${{ inputs.product_version }}
          CALLER_EVIDENCE_REQUEST: ${{ inputs.evidence_request }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isBundleStage = $env:REQUESTED_SCOPE -cin @('formatter','bundle','evidence')
          $hasCaller = -not [string]::IsNullOrEmpty($env:CALLER_CANDIDATE_SHA) -or -not [string]::IsNullOrEmpty($env:CALLER_BASELINE_SHA) -or -not [string]::IsNullOrEmpty($env:CALLER_VALIDATION_ID)
          if ($hasCaller) {
            if ($env:CALLER_CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:CALLER_BASELINE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Reusable validation requires immutable candidate and baseline SHAs' }
            if ($env:CALLER_VALIDATION_ID -cnotmatch '^[a-z][a-z0-9-]{0,31}$') { throw 'Unsafe validation invocation identity' }
            if ($isBundleStage) {
              if ($env:CALLER_FORMATTER_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Bundle validation requires immutable formatter source' }
              foreach ($version in @($env:CALLER_SOURCE_VERSION,$env:CALLER_FORMATTER_VERSION)) {
                if ($version.Length -gt 64 -or $version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Bundle validation requires stable native and formatter versions' }
              }
              if ($env:REQUESTED_SCOPE -cin @('bundle','evidence')) {
                if ($env:CALLER_PRODUCT_VERSION.Length -gt 64 -or $env:CALLER_PRODUCT_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Bundle validation requires stable product version' }
                if (-not $env:CALLER_EVIDENCE_REQUEST -or [Text.Encoding]::UTF8.GetByteCount($env:CALLER_EVIDENCE_REQUEST) -gt 16384) { throw 'Bounded evidence request required' }
                $request=ConvertFrom-Json $env:CALLER_EVIDENCE_REQUEST
                $keys=@($request.PSObject.Properties.Name | Sort-Object) -join ','
                $expected=if($env:REQUESTED_SCOPE -ceq 'bundle'){'formatter_artifact,runs'}else{'bundle_artifact,formatter_artifact,runs'}
                if ($keys -cne $expected -or $request.runs -isnot [array] -or $request.runs.Count -lt 1 -or $request.runs.Count -gt 7) { throw 'Invalid evidence request schema' }
                foreach($key in @('formatter_artifact')+$(if($env:REQUESTED_SCOPE -ceq 'evidence'){@('bundle_artifact')}else{@()})) {
                  if ($request.$key -is [string] -or $request.$key -is [bool] -or $request.$key -lt 1 -or $request.$key -gt 9007199254740991 -or [math]::Truncate($request.$key) -ne $request.$key) { throw 'Invalid distribution artifact identity' }
                }
              }
              $scopes = @($env:REQUESTED_SCOPE)
            }
            elseif ($env:REQUESTED_SCOPE -ceq 'feature') { $scopes = @('feature') }
            elseif ($env:REQUESTED_SCOPE -ceq 'cleanup') { $scopes = @('full', 'config', 'build') }
            else { throw 'Reusable validation requires feature or cleanup scope' }
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') { $scopes = @('feature') }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:REQUESTED_SCOPE -ceq 'integration') { $scopes = @('full', 'baseline', 'build') }
            elseif ($env:REQUESTED_SCOPE -ceq 'triage') { $scopes = @('triage-full', 'triage-baseline') }
            elseif ($env:REQUESTED_SCOPE -ceq 'triage-current') { $scopes = @('triage-full') }
            elseif ($env:REQUESTED_SCOPE -ceq 'cleanup-red') { $scopes = @('full', 'config', 'config-baseline') }
            elseif ($env:REQUESTED_SCOPE -ceq 'cleanup') { $scopes = @('full', 'config', 'build') }
            elseif ($env:REQUESTED_SCOPE -cin @('feature', 'full', 'baseline', 'build', 'config', 'config-baseline')) { $scopes = @($env:REQUESTED_SCOPE) }
            else { throw "Unsupported scope: $env:REQUESTED_SCOPE" }
          } else { throw "Unsupported event: $env:GITHUB_EVENT_NAME" }
          $matrix = @{ scope=$scopes } | ConvertTo-Json -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          $candidate = if ($hasCaller) { $env:CALLER_CANDIDATE_SHA } else { '' }
          "candidate_sha=$candidate" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          $nativeRequired = if ($isBundleStage) { 'false' } else { 'true' }
          "native_required=$nativeRequired" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          $suffix = if ($hasCaller) { "$env:CALLER_VALIDATION_ID-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" } else { "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" }
          $artifactNames = @($scopes | ForEach-Object { "codexs-statusline-$_-$suffix" })
          if ($isBundleStage) { $artifactNames = @("codexs-task9-quick-$suffix", "codexs-task9-$($env:REQUESTED_SCOPE)-$suffix") }
          if ($env:REQUESTED_SCOPE -ceq 'formatter') { $artifactNames += "codexs-formatter-dist-$suffix" }
          if ($env:REQUESTED_SCOPE -ceq 'bundle') { $artifactNames += "codexs-bundle-draft-$suffix" }
          $locator = @{
            schema=1; verified=$false; repository=$env:GITHUB_REPOSITORY
            candidate_sha=$env:CALLER_CANDIDATE_SHA; baseline_sha=$env:CALLER_BASELINE_SHA
            validation_id=$env:CALLER_VALIDATION_ID; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT
            scopes=@($scopes); artifacts=@($artifactNames)
          } | ConvertTo-Json -Compress -Depth 4
          "validation_summary=$locator" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

  quick_checks:
    name: Quick workflow and status-line formatting checks
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CODEXS_TASK9_SCOPE: ${{ inputs.scope }}
      CODEXS_NATIVE_SHA: ${{ inputs.candidate_sha }}
      CODEXS_UPSTREAM_SHA: ${{ inputs.baseline_sha }}
      CODEXS_FORMATTER_SHA: ${{ inputs.formatter_sha }}
      CODEXS_FORMATTER_VERSION: ${{ inputs.formatter_version }}
      CODEXS_SOURCE_VERSION: ${{ inputs.source_version }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout current source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout candidate for formatting
        if: needs.plan.outputs.candidate_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.candidate_sha }}
          path: candidate-format

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify quick-check GitHub exit boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath '.github/workflows/codexs-statusline.yml' -Raw
          $match = [regex]::Match($workflow, '(?ms)^      - name: Verify workflow behavior without compiling Rust\r?\n        run: \|\r?\n(?<code>.*?)(?=^      - name: |\z)')
          if (-not $match.Success) { throw 'Cannot locate quick-check script for exit-boundary test' }
          $body = [regex]::Replace($match.Groups['code'].Value, '(?m)^          ', '')
          $probeRoot = Join-Path ([System.IO.Path]::GetTempPath()) ('codexs-ci-exit-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          try {
            $env:CODEXS_STEP_EXIT_SCRIPT = Join-Path $probeRoot 'github-step.ps1'
            # Reproduce actions/runner ScriptHandlerHelpers.FixUpScriptContents.
            $wrapped = "`$ErrorActionPreference = 'stop'`n" + $body + "`nif ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit `$LASTEXITCODE }"
            [System.IO.File]::WriteAllText($env:CODEXS_STEP_EXIT_SCRIPT, $wrapped, [System.Text.UTF8Encoding]::new($false))
            & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -Command '& ([scriptblock]::Create([System.IO.File]::ReadAllText($env:CODEXS_STEP_EXIT_SCRIPT)))'
            $stepExit = $LASTEXITCODE
            if ($stepExit -ne 0) { throw "Quick checks returned process exit $stepExit after expected negative native probes" }
            Write-Host 'PASS successful quick checks return process exit 0 through GitHub wrapper'
          } finally {
            $resolvedProbe = [System.IO.Path]::GetFullPath($probeRoot)
            $resolvedTemp = [System.IO.Path]::GetFullPath([System.IO.Path]::GetTempPath()).TrimEnd('\') + '\'
            if (-not $resolvedProbe.StartsWith($resolvedTemp, [StringComparison]::OrdinalIgnoreCase) -or
                [System.IO.Path]::GetFileName($resolvedProbe) -notmatch '^codexs-ci-exit-[0-9a-f]{32}$') { throw 'Unsafe exit-probe cleanup path' }
            Remove-Item -LiteralPath $resolvedProbe -Recurse -Force -ErrorAction Stop
          }

      - name: Verify workflow behavior without compiling Rust
        run: |
          $WorkflowPath = Join-Path (Get-Location) '.github/workflows/codexs-statusline.yml'
          $ErrorActionPreference = 'Stop'
          # Probes deliberately rewrite RUNNER_TEMP and run IDs; retain the real controller destination first.
          $task9CaptureRoot=if($env:CODEXS_TASK9_SCOPE -cin @('formatter','bundle','evidence')){Join-Path $env:RUNNER_TEMP "codexs-task9-quick-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"}else{$null}
          $workflow = Get-Content -LiteralPath $WorkflowPath -Raw
          $probeRoot = Join-Path ([System.IO.Path]::GetTempPath()) ('codexs-ci-probe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          $result = @{ passed=0; failures=[System.Collections.Generic.List[string]]::new() }
          try {
          function StepScript([string]$name) {
              foreach ($match in [regex]::Matches($workflow, '(?ms)^      - name: (?<name>[^\r\n]+)\r?\n(?<body>.*?)(?=^      - name: |\z)')) {
                  if ($match.Groups['name'].Value.Trim() -cne $name) { continue }
                  $script = [regex]::Match($match.Groups['body'].Value, '(?m)^        run: \|\r?\n(?<script>(?:^          [^\r\n]*(?:\r?\n|$)|^\r?\n)+)')
                  if ($script.Success) { return ([regex]::Replace($script.Groups['script'].Value, '(?m)^          ', '')) }
              }
              return $null
          }
          function Check([string]$name, [scriptblock]$body) {
              try { & $body; $result.passed++; Write-Host "PASS $name" }
              catch { $result.failures.Add("$name`: $($_.Exception.Message)"); Write-Host "FAIL $name`: $($_.Exception.Message)" }
          }
          function Equal($actual, $expected) {
              if (($actual -join "`n") -cne ($expected -join "`n")) { throw "expected [$($expected -join ', ')] but got [$($actual -join ', ')]" }
          }
          # Break caught: a push inherits a manual request, integration loses a scope,
          # or invalid manual input reaches a native runner. Execute the real selector.
          $selector = StepScript 'Resolve execution scopes'
          if (-not $selector) { $selector = StepScript 'Select validated scope' }
          foreach ($case in @(
              @{name='push always selects feature'; event='push'; request='integration'; want=@('feature')},
              @{name='manual feature'; event='workflow_dispatch'; request='feature'; want=@('feature')},
              @{name='manual full'; event='workflow_dispatch'; request='full'; want=@('full')},
              @{name='manual baseline'; event='workflow_dispatch'; request='baseline'; want=@('baseline')},
              @{name='manual build'; event='workflow_dispatch'; request='build'; want=@('build')},
              @{name='manual config'; event='workflow_dispatch'; request='config'; want=@('config')},
              @{name='manual config baseline'; event='workflow_dispatch'; request='config-baseline'; want=@('config-baseline')},
              @{name='cleanup RED compares config and runs full TUI'; event='workflow_dispatch'; request='cleanup-red'; want=@('full','config','config-baseline')},
              @{name='cleanup verifies full TUI config and CLI'; event='workflow_dispatch'; request='cleanup'; want=@('full','config','build')},
              @{name='triage-current checks only the current revision'; event='workflow_dispatch'; request='triage-current'; want=@('triage-full')},
              @{name='triage compares both revisions serially'; event='workflow_dispatch'; request='triage'; want=@('triage-full','triage-baseline')},
              @{name='integration expands three independent scopes'; event='workflow_dispatch'; request='integration'; want=@('full','baseline','build')}
          )) {
              Check $case.name {
                  $env:GITHUB_EVENT_NAME = $case.event
                  $env:REQUESTED_SCOPE = $case.request
                  $env:RUNNER_TEMP = $probeRoot
                  $env:GITHUB_RUN_ID = 'synthetic-run'
                  $env:GITHUB_RUN_ATTEMPT = [guid]::NewGuid().ToString('N')
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.output')
                  $env:GITHUB_ENV = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.env')
                  try { & ([scriptblock]::Create($selector)) | Out-Null } catch { throw "selector rejected valid input: $($_.Exception.Message)" }
                  $output = @(Get-Content -LiteralPath $env:GITHUB_OUTPUT -ErrorAction SilentlyContinue)
                  $matrix = @($output | Where-Object { $_.StartsWith('matrix=') })
                  if ($matrix.Count -ne 1) { throw 'selector did not emit one runnable matrix' }
                  Equal @(($matrix[0].Substring(7) | ConvertFrom-Json).scope) $case.want
              }
          }
          foreach ($request in @('', 'unknown', 'feature,build', '../baseline')) {
              Check "invalid request [$request] fails closed" {
                  $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
                  $env:REQUESTED_SCOPE = $request
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ([guid]::NewGuid().ToString('N') + '.output')
                  $rejected = $false
                  try { & ([scriptblock]::Create($selector)) | Out-Null } catch { $rejected = $true }
                  Equal $rejected $true
                  Equal (Test-Path -LiteralPath $env:GITHUB_OUTPUT) $false
              }
          }
          # Break caught: two matrix scopes write to the same log directory.
          $selection = StepScript 'Select validated scope'
          Check 'matrix scopes produce separate log directories' {
              $paths = @()
              foreach ($scope in @('full','baseline','build','triage-full','triage-baseline','config','config-baseline')) {
                  $env:MATRIX_SCOPE = $scope
                  $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
                  $env:REQUESTED_SCOPE = $scope
                  $env:GITHUB_RUN_ID = 'synthetic-matrix'
                  $env:GITHUB_RUN_ATTEMPT = '1'
                  $env:RUNNER_TEMP = $probeRoot
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ($scope + '.output')
                  $env:GITHUB_ENV = Join-Path $probeRoot ($scope + '.env')
                  & ([scriptblock]::Create($selection)) | Out-Null
                  $entry = Get-Content -LiteralPath $env:GITHUB_ENV | Where-Object { $_.StartsWith('CODEXS_LOG_DIR=') }
                  $paths += $entry.Substring(15)
              }
              Equal @($paths | Select-Object -Unique).Count 7
          }
          foreach ($scope in @('feature','full','baseline','build','triage-full','triage-baseline','config','config-baseline')) {
              Check "$scope selects its exact source ref" {
                  $env:MATRIX_SCOPE = $scope
                  $env:GITHUB_SHA = 'b' * 40
                  $env:GITHUB_RUN_ATTEMPT = [guid]::NewGuid().ToString('N')
                  $env:GITHUB_OUTPUT = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.output')
                  $env:GITHUB_ENV = Join-Path $probeRoot ($env:GITHUB_RUN_ATTEMPT + '.env')
                  & ([scriptblock]::Create($selection)) | Out-Null
                  $refs = @(Get-Content -LiteralPath $env:GITHUB_OUTPUT | Where-Object { $_.StartsWith('source_ref=') })
                  Equal $refs.Count 1
                  $want = if ($scope -cin @('baseline','triage-baseline','config-baseline')) { '1ee2374c675b1aeae8ca76e1c6c75a6a62619f8e' } else { $env:GITHUB_SHA }
                  Equal $refs[0].Substring(11) $want
              }
          }
          # Only the expensive external Rust compiler is replaced. The real runner
          # resolves a native executable, passes arguments, captures output and exits.
          $fakeBin = Join-Path $probeRoot 'native'
          New-Item -ItemType Directory -Path $fakeBin | Out-Null
          $fakeExe = Join-Path $fakeBin 'rustup.exe'
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          public static class CodexsCargoBoundaryProbe {
              public static int Main(string[] args) {
                  if (Array.IndexOf(args, "app::tests::background_exit_tests::exit_interrupts_before_requesting_shutdown") >= 0) {
                      File.WriteAllLines(Environment.GetEnvironmentVariable("CODEXS_PROBE_DIAGNOSTIC_ARGS"), args);
                      Console.WriteLine(Environment.GetEnvironmentVariable("CODEXS_PROBE_DIAGNOSTIC_ZERO") == "1"
                          ? "test result: ok. 0 passed; 0 failed; 0 ignored;"
                          : "test result: ok. 1 passed; 0 failed; 0 ignored;");
                      return int.Parse(Environment.GetEnvironmentVariable("CODEXS_PROBE_DIAGNOSTIC_EXIT") ?? "0");
                  }
                  File.WriteAllLines(Environment.GetEnvironmentVariable("CODEXS_PROBE_ARGS"), args);
                  Console.WriteLine("synthetic native boundary probe (no Rust build)");
                  string readiness = Environment.GetEnvironmentVariable("CODEXS_PROBE_READINESS_FAILURE");
                  if (readiness == "1" || readiness == "header") {
                      Console.WriteLine("---- app::tests::background_exit_tests::exit_interrupts_before_requesting_shutdown stdout ----");
                  }
                  if (readiness == "1") {
                      Console.WriteLine("shell command should be running before interruption: deadline has elapsed; script_started=Some(false)");
                      Console.WriteLine("test result: FAILED. 5778 passed; 1 failed; 4 ignored;");
                  }
                  return int.Parse(Environment.GetEnvironmentVariable("CODEXS_PROBE_EXIT"));
              }
          }
          '@ -OutputAssembly $fakeExe -OutputType ConsoleApplication
          $fakeCodex = Join-Path $fakeBin 'codex.exe'
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          public static class CodexsVersionBoundaryProbe {
              public static int Main(string[] args) {
                  if (args.Length > 0 && args[0] == "codexs-smoke") {
                      if (args.Length == 1 || Array.IndexOf(args, "--unknown") >= 0) { Console.Error.WriteLine("SMOKE_ARGS"); return 1; }
                      int index = Array.IndexOf(args, "--formatter");
                      if (index < 0 || index + 1 >= args.Length) { return 1; }
                      if (Path.GetFileName(args[index + 1]).StartsWith("wrong")) { Console.Error.WriteLine("SMOKE_OUTPUT"); return 1; }
                      Console.WriteLine("{\"schema\":1,\"runner\":\"ok\",\"formatter\":\"ok\",\"cleanup\":\"ok\"}");
                      return 0;
                  }
                  File.WriteAllLines(Environment.GetEnvironmentVariable("CODEXS_PROBE_VERSION_ARGS"), args);
                  if (Environment.GetEnvironmentVariable("CODEXS_PROBE_VERSION_EMPTY") != "1") {
                      Console.WriteLine(Environment.GetEnvironmentVariable("CODEXS_PROBE_VERSION_TEXT") ?? "codex-cli 0.162.1");
                  }
                  return int.Parse(Environment.GetEnvironmentVariable("CODEXS_PROBE_VERSION_EXIT") ?? "0");
              }
          }
          '@ -OutputAssembly $fakeCodex -OutputType ConsoleApplication
          $defaultTarget = Join-Path $probeRoot 'target'
          $defaultRelease = Join-Path $defaultTarget 'release'
          New-Item -ItemType Directory -Path $defaultRelease | Out-Null
          Copy-Item -LiteralPath $fakeCodex -Destination (Join-Path $defaultRelease 'codex.exe')
          $env:CARGO_TARGET_DIR = $defaultTarget
          $env:CODEXS_PROBE_VERSION_ARGS = Join-Path $probeRoot 'default-version.args'
          $env:CODEXS_PROBE_VERSION_TEXT = 'codex-cli 0.162.1'
          $env:CODEXS_PROBE_VERSION_EXIT = '0'
          $env:CODEXS_PROBE_VERSION_EMPTY = '0'
          $env:PATH = $fakeBin + ';' + $env:PATH
          if ((Get-Command rustup.exe -ErrorAction Stop).Source -cne $fakeExe) { throw 'Native probe executable did not resolve; refusing to run Rust' }
          $native = StepScript 'Run guarded native Cargo operation'
          $runner = [regex]::Match($native, '(?ms)^\$runnerSource = @''\r?\n(?<source>.*?)^''@').Groups['source'].Value
          $triageArgs = @(
              'run','1.95.0','cargo','test','--release','--locked','-p','codex-tui',
              '--config','profile.release.package.codex-tui.opt-level=1','--timings',
              '--lib','--','--exact','--test-threads=1',
              'app::tests::backend_banner_fallback_tests::backend_banner_fallback_uses_current_task_and_accepted_generation',
              'app::tests::backend_banner_fallback_tests::backend_banner_fallback_updates_task_settings_and_keeps_notice',
              'app::tests::luna_reserve_recovery_tests::luna_reserve_recovery_does_not_override_manual_choice_or_account_change',
              'app::tests::luna_reserve_recovery_tests::luna_reserve_recovery_requires_permission_and_no_remaining_blocker',
              'app::tests::session_lifecycle_requests::startup_defaults_tests::fresh_startup_falls_back_only_for_unsupported_config_read',
              'app::tests::session_lifecycle_requests::startup_defaults_tests::startup_reads_server_defaults_before_starting_thread',
              'app::owned_transcript::tests::fullscreen_composer_remote_images_leave_an_editable_prompt_row',
              'app::owned_transcript::tests::older_page_loading_uses_the_status_row_without_moving_content_or_cursor',
              'app::owned_transcript::tests::owned_transcript_reserves_a_row_above_the_composer',
              'app::owned_transcript::tests::recap_spacing_belongs_to_the_transcript_tail',
              'app::turn_tips::tests::turn_tip_placements_and_completion_barrier'
          )
          foreach ($case in @(
              @{scope='feature'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--lib','status_line_command')},
              @{scope='full'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--no-fail-fast','--','--test-threads=1')},
              @{scope='baseline'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-tui','--config','profile.release.package.codex-tui.opt-level=1','--timings','--no-fail-fast','--','--test-threads=1')},
              @{scope='triage-full'; want=$triageArgs},
              @{scope='triage-baseline'; want=$triageArgs},
              @{scope='config'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-config','--timings','--no-fail-fast')},
              @{scope='config-baseline'; want=@('run','1.95.0','cargo','test','--release','--locked','-p','codex-config','--timings','--no-fail-fast')},
              @{scope='build'; want=@('run','1.95.0','cargo','build','--release','--locked','-p','codex-cli','--bin','codex','--timings')}
          )) {
              foreach ($nativeExit in @(0,101)) {
                  Check "$($case.scope) passes intended Cargo args and preserves exit $nativeExit" {
                      $id = [guid]::NewGuid().ToString('N')
                      $env:CODEXS_PROBE_ARGS = Join-Path $probeRoot ($id + '.args')
                      $env:CODEXS_PROBE_EXIT = "$nativeExit"
                      $statePath = Join-Path $probeRoot ($id + '.json')
                      $state = @{
                          workdir=$probeRoot; scope=$case.scope; source_sha=('a' * 40)
                          workspace_version='0.162.1'
                          cargo_log=(Join-Path $probeRoot ($id + '.log'))
                          native_exit=(Join-Path $probeRoot ($id + '.exit'))
                          runner_error=(Join-Path $probeRoot ($id + '.error'))
                      }
                      $state | ConvertTo-Json | Out-File -LiteralPath $statePath -Encoding utf8
                      $env:CODEXS_GUARD_STATE = $statePath
                      $env:CODEXS_PROBE_RUNNER_SCRIPT = Join-Path $probeRoot ($id + '.runner.ps1')
                      [IO.File]::WriteAllText($env:CODEXS_PROBE_RUNNER_SCRIPT,"`$ProgressPreference = 'SilentlyContinue'`n" + $runner,[Text.UTF8Encoding]::new($false))
                      & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -Command '. ([scriptblock]::Create([IO.File]::ReadAllText($env:CODEXS_PROBE_RUNNER_SCRIPT)))' > $null 2> (Join-Path $probeRoot ($id + '.stderr'))
                      $exitCode = $LASTEXITCODE
                      Equal $exitCode $nativeExit
                      Equal (Get-Content -LiteralPath $state.native_exit) "$nativeExit"
                      Equal @(Get-Content -LiteralPath $env:CODEXS_PROBE_ARGS) $case.want
                      $expectedOpt = if ($case.scope -cin @('config','config-baseline')) { 'n/a' } else { '1' }
                      $header = Get-Content -LiteralPath $state.cargo_log -TotalCount 1
                      Equal ($header -match ('tui_opt=' + [regex]::Escape($expectedOpt) + ' ')) $true
                  }
              }
          }
          foreach ($case in @(
              @{name='isolated pass preserves full failure'; scope='full'; primary=101; diagnostic=0; zero='0'; run=$true; verified=$true},
              @{name='isolated failure preserves full failure'; scope='full'; primary=101; diagnostic=101; zero='0'; run=$true; verified=$false},
              @{name='zero selected tests is not diagnostic success'; scope='full'; primary=101; diagnostic=0; zero='1'; run=$true; verified=$false},
              @{name='unwritable diagnostic log preserves full failure'; scope='full'; primary=101; diagnostic=0; zero='0'; run=$false; verified=$false; logBlocked=$true},
              @{name='unrelated full failure is not rerun'; scope='full'; primary=101; diagnostic=0; zero='0'; run=$false; verified=$false; readiness='0'},
              @{name='test name alone does not trigger a readiness rerun'; scope='full'; primary=101; diagnostic=0; zero='0'; run=$false; verified=$false; readiness='header'},
              @{name='passing full suite is not rerun'; scope='full'; primary=0; diagnostic=0; zero='0'; run=$false; verified=$false},
              @{name='feature scope is not rerun'; scope='feature'; primary=101; diagnostic=0; zero='0'; run=$false; verified=$false},
              @{name='baseline scope is not rerun'; scope='baseline'; primary=101; diagnostic=0; zero='0'; run=$false; verified=$false}
          )) {
              Check "readiness diagnostic: $($case.name)" {
                  $id = [guid]::NewGuid().ToString('N')
                  $env:CODEXS_PROBE_ARGS = Join-Path $probeRoot ($id + '.args')
                  $env:CODEXS_PROBE_EXIT = "$($case.primary)"
                  $env:CODEXS_PROBE_READINESS_FAILURE = if ($case.ContainsKey('readiness')) { $case.readiness } else { '1' }
                  $env:CODEXS_PROBE_DIAGNOSTIC_ARGS = Join-Path $probeRoot ($id + '.diagnostic-args')
                  $env:CODEXS_PROBE_DIAGNOSTIC_EXIT = "$($case.diagnostic)"
                  $env:CODEXS_PROBE_DIAGNOSTIC_ZERO = $case.zero
                  try {
                      $statePath = Join-Path $probeRoot ($id + '.json')
                      $state = @{
                          workdir=$probeRoot; scope=$case.scope; source_sha=('a' * 40)
                          workspace_version='0.162.1'
                          cargo_log=(Join-Path $probeRoot ($id + '.log'))
                          native_exit=(Join-Path $probeRoot ($id + '.exit'))
                          runner_error=(Join-Path $probeRoot ($id + '.error'))
                      }
                      $state | ConvertTo-Json | Out-File -LiteralPath $statePath -Encoding utf8
                      if ($case.logBlocked) {
                          New-Item -ItemType Directory -Path ([IO.Path]::ChangeExtension($state.cargo_log, '.exit-readiness.log')) | Out-Null
                      }
                      $env:CODEXS_GUARD_STATE = $statePath
                      $env:CODEXS_PROBE_RUNNER_SCRIPT = Join-Path $probeRoot ($id + '.runner.ps1')
                      [IO.File]::WriteAllText($env:CODEXS_PROBE_RUNNER_SCRIPT,$runner,[Text.UTF8Encoding]::new($false))
                      & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -Command '. ([scriptblock]::Create([IO.File]::ReadAllText($env:CODEXS_PROBE_RUNNER_SCRIPT)))' > $null 2> (Join-Path $probeRoot ($id + '.stderr'))
                      $exitCode = $LASTEXITCODE
                      Equal $exitCode $case.primary
                      Equal (Get-Content -LiteralPath $state.native_exit) "$($case.primary)"
                      Equal (Test-Path -LiteralPath $state.runner_error) $false
                      Equal (Test-Path -LiteralPath $env:CODEXS_PROBE_DIAGNOSTIC_ARGS) $case.run
                      if ($case.run) {
                          Equal @(Get-Content -LiteralPath $env:CODEXS_PROBE_DIAGNOSTIC_ARGS) @(
                              'run','1.95.0','cargo','test','--release','--locked','-p','codex-tui',
                              '--config','profile.release.package.codex-tui.opt-level=1','--lib',
                              'app::tests::background_exit_tests::exit_interrupts_before_requesting_shutdown',
                              '--','--exact','--test-threads=1','--nocapture'
                          )
                          $diagnosticLog = [IO.Path]::ChangeExtension($state.cargo_log, '.exit-readiness.log')
                          $diagnosticText = Get-Content -LiteralPath $diagnosticLog -Raw
                          Equal ($diagnosticText -match ('verified_single_test=' + $case.verified)) $true
                          # Isolated results must not change the full-suite totals.
                          Equal @(Get-Content -LiteralPath $state.cargo_log | Where-Object { $_ -match '^test result:' }).Count 1
                      }
                  } finally {
                      Remove-Item Env:CODEXS_PROBE_READINESS_FAILURE -ErrorAction SilentlyContinue
                      Remove-Item Env:CODEXS_PROBE_DIAGNOSTIC_ARGS -ErrorAction SilentlyContinue
                      Remove-Item Env:CODEXS_PROBE_DIAGNOSTIC_EXIT -ErrorAction SilentlyContinue
                      Remove-Item Env:CODEXS_PROBE_DIAGNOSTIC_ZERO -ErrorAction SilentlyContinue
                  }
              }
          }
          # Execute the real result boundary: a partial exact-name selection must not go green.
          $summary = $native.Substring($native.IndexOf('$lines = if (Test-Path -LiteralPath $outPath)'))
          foreach ($scope in @('config','config-baseline')) {
              foreach ($case in @(@{count=0; native=0; failed=0; reject=$true}, @{count=3; native=0; failed=0; reject=$false}, @{count=3; native=101; failed=1; reject=$true}, @{count=3; native=0; failed=1; reject=$true}, @{count=3; native=0; failed=0; ignored=3; reject=$true})) {
                  Check "$scope propagates native $($case.native) with count $($case.count)" {
                      $id = [guid]::NewGuid().ToString('N')
                      $outPath = Join-Path $probeRoot ($id + '.log')
                      $exitPath = Join-Path $probeRoot ($id + '.exit')
                      $stopPath = Join-Path $probeRoot ($id + '.stop')
                      $resultPath = Join-Path $probeRoot ($id + '.outcome')
                      $wrapperProblem = $null
                      $runnerErrorPath = Join-Path $probeRoot ($id + '.absent-error')
                      $env:CODEXS_SCOPE = $scope
                      $env:CODEXS_SOURCE_SHA = 'a' * 40
                      $env:GITHUB_STEP_SUMMARY = ''
                      $ignoredCount = if ($case.ContainsKey('ignored')) { $case.ignored } else { 0 }
                      $passedCount = $case.count - $case.failed - $ignoredCount
                      "test result: ok. $passedCount passed; $($case.failed) failed; $ignoredCount ignored; 0 measured; 0 filtered out; finished in 0.00s" | Out-File -LiteralPath $outPath -Encoding utf8
                      "$($case.native)" | Out-File -LiteralPath $exitPath -Encoding ascii
                      $rejected = $false
                      try { & ([scriptblock]::Create($summary)) | Out-Null } catch { $rejected = $true }
                      Equal $rejected $case.reject
                  }
              }
          }
          foreach ($scope in @('triage-full','triage-baseline')) {
              foreach ($count in @(0,10,11,12)) {
                  Check "$scope requires all eleven diagnostic tests (observed $count)" {
                      $id = [guid]::NewGuid().ToString('N')
                      $outPath = Join-Path $probeRoot ($id + '.log')
                      $exitPath = Join-Path $probeRoot ($id + '.exit')
                      $stopPath = Join-Path $probeRoot ($id + '.stop')
                      $resultPath = Join-Path $probeRoot ($id + '.outcome')
                      $wrapperProblem = $null
                      $runnerErrorPath = Join-Path $probeRoot ($id + '.absent-error')
                      $env:CODEXS_SCOPE = $scope
                      $env:CODEXS_SOURCE_SHA = 'a' * 40
                      $env:GITHUB_STEP_SUMMARY = ''
                      "test result: ok. $count passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s" | Out-File -LiteralPath $outPath -Encoding utf8
                      '0' | Out-File -LiteralPath $exitPath -Encoding ascii
                      $rejected = $false
                      try { & ([scriptblock]::Create($summary)) | Out-Null } catch { $rejected = $true }
                      Equal $rejected ($count -ne 11)
                  }
              }
          }
          foreach ($hasRunnerError in @($false,$true)) {
              Check "build summary rejects runner error=$hasRunnerError despite Cargo exit 0" {
                  $id = [guid]::NewGuid().ToString('N')
                  $outPath = Join-Path $probeRoot ($id + '.log')
                  $exitPath = Join-Path $probeRoot ($id + '.exit')
                  $stopPath = Join-Path $probeRoot ($id + '.stop')
                  $resultPath = Join-Path $probeRoot ($id + '.outcome')
                  $runnerErrorPath = Join-Path $probeRoot ($id + '.error')
                  $wrapperProblem = $null
                  $env:CODEXS_SCOPE = 'build'
                  $env:CODEXS_SOURCE_SHA = 'a' * 40
                  $env:GITHUB_STEP_SUMMARY = ''
                  'synthetic successful Cargo build' | Out-File -LiteralPath $outPath -Encoding utf8
                  '0' | Out-File -LiteralPath $exitPath -Encoding ascii
                  if ($hasRunnerError) { 'RUNNER_SETUP_FAILURE synthetic version rejection' | Out-File -LiteralPath $runnerErrorPath -Encoding utf8 }
                  $rejected = $false
                  try { & ([scriptblock]::Create($summary)) | Out-Null } catch { $rejected = $true }
                  Equal $rejected $hasRunnerError
              }
          }
          foreach ($case in @(
              @{name='correct package version'; text='codex-cli 0.162.1'; empty='0'; versionExit=0; missing=$false; want=0},
              @{name='newer stable package version'; text='codex-cli 0.166.0'; expected='0.166.0'; empty='0'; versionExit=0; missing=$false; want=0},
              @{name='old binary for newer source'; text='codex-cli 0.162.1'; expected='0.166.0'; empty='0'; versionExit=0; missing=$false; want=251},
              @{name='wrong development version'; text='codex-cli 0.0.0'; empty='0'; versionExit=0; missing=$false; want=251},
              @{name='empty version output'; text=''; empty='1'; versionExit=0; missing=$false; want=251},
              @{name='nonzero version exit'; text='codex-cli 0.162.1'; empty='0'; versionExit=7; missing=$false; want=251},
              @{name='missing built binary'; text='codex-cli 0.162.1'; empty='0'; versionExit=0; missing=$true; want=251}
          )) {
              Check "build validates $($case.name) through the native version boundary" {
                  $id = [guid]::NewGuid().ToString('N')
                  $env:CARGO_TARGET_DIR = Join-Path $probeRoot ($id + '.target')
                  try {
                      $release = Join-Path $env:CARGO_TARGET_DIR 'release'
                      New-Item -ItemType Directory -Path $release | Out-Null
                      if (-not $case.missing) { Copy-Item -LiteralPath $fakeCodex -Destination (Join-Path $release 'codex.exe') }
                      $env:CODEXS_PROBE_ARGS = Join-Path $probeRoot ($id + '.cargo-args')
                      $env:CODEXS_PROBE_EXIT = '0'
                      $env:CODEXS_PROBE_VERSION_ARGS = Join-Path $probeRoot ($id + '.version-args')
                      $env:CODEXS_PROBE_VERSION_TEXT = $case.text
                      $env:CODEXS_PROBE_VERSION_EXIT = "$($case.versionExit)"
                      $env:CODEXS_PROBE_VERSION_EMPTY = $case.empty
                      $statePath = Join-Path $probeRoot ($id + '.json')
                      $state = @{
                          workdir=$probeRoot; scope='build'; source_sha=('a' * 40)
                          workspace_version=$(if ($case.expected) { $case.expected } else { '0.162.1' })
                          cargo_log=(Join-Path $probeRoot ($id + '.log'))
                          native_exit=(Join-Path $probeRoot ($id + '.exit'))
                          runner_error=(Join-Path $probeRoot ($id + '.error'))
                      }
                      $state | ConvertTo-Json | Out-File -LiteralPath $statePath -Encoding utf8
                      $env:CODEXS_GUARD_STATE = $statePath
                      $env:CODEXS_PROBE_RUNNER_SCRIPT = Join-Path $probeRoot ($id + '.runner.ps1')
                      [IO.File]::WriteAllText($env:CODEXS_PROBE_RUNNER_SCRIPT,"`$ProgressPreference = 'SilentlyContinue'`n" + $runner,[Text.UTF8Encoding]::new($false))
                      & powershell.exe -NoProfile -NonInteractive -OutputFormat Text -Command '. ([scriptblock]::Create([IO.File]::ReadAllText($env:CODEXS_PROBE_RUNNER_SCRIPT)))' > $null 2> (Join-Path $probeRoot ($id + '.stderr'))
                      $exitCode = $LASTEXITCODE
                      Equal $exitCode $case.want
                      Equal (Get-Content -LiteralPath $state.native_exit) '0'
                      Equal (Test-Path -LiteralPath $state.runner_error) ($case.want -ne 0)
                      if (-not $case.missing) {
                          Equal (Test-Path -LiteralPath $env:CODEXS_PROBE_VERSION_ARGS) $true
                          Equal @(Get-Content -LiteralPath $env:CODEXS_PROBE_VERSION_ARGS) @('--version')
                      }
                      else { Equal (Test-Path -LiteralPath $env:CODEXS_PROBE_VERSION_ARGS) $false }
                      $outPath = $state.cargo_log
                      $exitPath = $state.native_exit
                      $stopPath = Join-Path $probeRoot ($id + '.stop')
                      $resultPath = Join-Path $probeRoot ($id + '.outcome')
                      $runnerErrorPath = $state.runner_error
                      $wrapperProblem = $null
                      $env:CODEXS_SCOPE = 'build'
                      $env:CODEXS_SOURCE_SHA = 'a' * 40
                      $env:GITHUB_STEP_SUMMARY = ''
                      $rejected = $false
                      try { & ([scriptblock]::Create($summary)) | Out-Null } catch { $rejected = $true }
                      Equal $rejected ($case.want -ne 0)
                  } finally {
                      $env:CARGO_TARGET_DIR = $defaultTarget
                      $env:CODEXS_PROBE_VERSION_ARGS = Join-Path $probeRoot 'default-version.args'
                      $env:CODEXS_PROBE_VERSION_TEXT = 'codex-cli 0.162.1'
                      $env:CODEXS_PROBE_VERSION_EXIT = '0'
                      $env:CODEXS_PROBE_VERSION_EMPTY = '0'
                  }
              }
          }
          } finally {
          $resolvedProbe = [System.IO.Path]::GetFullPath($probeRoot)
          $resolvedTemp = [System.IO.Path]::GetFullPath([System.IO.Path]::GetTempPath()).TrimEnd('\') + '\'
          if (-not $resolvedProbe.StartsWith($resolvedTemp, [StringComparison]::OrdinalIgnoreCase) -or
              [System.IO.Path]::GetFileName($resolvedProbe) -notmatch '^codexs-ci-probe-[0-9a-f]{32}$') { throw 'Unsafe probe cleanup path' }
          Remove-Item -LiteralPath $resolvedProbe -Recurse -Force -ErrorAction Stop
          }
          Write-Host "RESULT passed=$($result.passed) failed=$($result.failures.Count)"
          if ($task9CaptureRoot) {
            [void][IO.Directory]::CreateDirectory($task9CaptureRoot)
            [IO.File]::WriteAllText((Join-Path $task9CaptureRoot 'quick.log'),"RESULT passed=$($result.passed) failed=$($result.failures.Count)`n",[Text.UTF8Encoding]::new($false))
          }
          if ($result.failures.Count) { throw ($result.failures -join "`n") }
          # Expected nonzero probe exits have been checked; do not leak one to GitHub's shell epilogue.
          exit 0

      - name: Check isolated codexs installer
        run: |
          $ErrorActionPreference = 'Stop'
          $testPath = Join-Path (Get-Location) 'codexs/install.Tests.ps1'
          $lines = @(& ([scriptblock]::Create([System.IO.File]::ReadAllText($testPath))) -InstallerPath (Join-Path (Get-Location) 'codexs/install.ps1'))
          $lines | ForEach-Object { Write-Host $_ }
          if ($env:CODEXS_TASK9_SCOPE -cin @('formatter','bundle','evidence')) {
            $recordRoot=Join-Path $env:RUNNER_TEMP "codexs-task9-quick-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            [void][IO.Directory]::CreateDirectory($recordRoot)
            [IO.File]::WriteAllText((Join-Path $recordRoot 'installer.log'),(($lines -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))
          }
          $summaries = @($lines | Where-Object { $_ -cmatch '^Installer assertions: [1-9][0-9]* passed; 0 failed$' })
          $allSummaries = @($lines | Where-Object { $_ -cmatch '^Installer assertions:' })
          if ($summaries.Count -ne 1 -or $allSummaries.Count -ne 1) { throw 'Installer suite did not prove successful executed assertions' }
          $global:LASTEXITCODE = 0

      - name: Install Node for isolated update checks
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check isolated update modules
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('codexs/upstream/upstream.test.cjs','codexs/release/workflow.test.cjs','codexs/release/check-tests.test.cjs','codexs/release/evidence.test.cjs','codexs/release/package.test.cjs','codexs/update/protocol.test.cjs','codexs/update/paths.test.cjs','codexs/update/bootstrap.test.cjs','codexs/update/launch.test.cjs','codexs/update/http.test.cjs','codexs/update/state.test.cjs','codexs/update/stage.test.cjs')
          foreach ($file in $required) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Missing required updater test suite' } }
          $tests = @(Get-ChildItem -LiteralPath 'codexs/upstream','codexs/release','codexs/update' -Filter '*.test.cjs' -File -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName })
          $ErrorActionPreference = 'Continue'
          $captureScope=$env:CODEXS_TASK9_SCOPE
          try {
            # Child fixture workflows must not be able to capture into this job's evidence directory.
            Remove-Item Env:CODEXS_TASK9_SCOPE -ErrorAction SilentlyContinue
            $nodeLines = @(& node codexs/release/check-tests.cjs @tests 2>&1 | ForEach-Object { "$_" })
            $nodeExit = $LASTEXITCODE
          } finally { $env:CODEXS_TASK9_SCOPE=$captureScope }
          $ErrorActionPreference = 'Stop'
          $nodeLines | ForEach-Object { Write-Host $_ }
          $recordRoot=$null
          if ($env:CODEXS_TASK9_SCOPE -cin @('formatter','bundle','evidence')) {
            $recordRoot=Join-Path $env:RUNNER_TEMP "codexs-task9-quick-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            [void][IO.Directory]::CreateDirectory($recordRoot)
            [IO.File]::WriteAllText((Join-Path $recordRoot 'updater.log'),(($nodeLines -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))
          }
          $summaries = @($nodeLines | Where-Object { $_ -ceq ('# codexs verified suites ' + $tests.Count) })
          if ($null -eq $nodeExit -or $nodeExit -ne 0 -or $tests.Count -lt $required.Count -or $summaries.Count -ne 1) { throw 'Updater module suites did not prove successful executed cases in every file' }
          foreach ($suite in @('archive','coordinator','enroll')) {
            $suitePath = Join-Path (Get-Location) ('codexs/update/' + $suite + '.Tests.ps1')
            if (-not (Test-Path -LiteralPath $suitePath -PathType Leaf)) { throw 'Missing required PowerShell updater suite' }
            $lines = @(& ([scriptblock]::Create([IO.File]::ReadAllText($suitePath))))
            $lines | ForEach-Object { Write-Host $_ }
            if ($recordRoot) { [IO.File]::AppendAllText((Join-Path $recordRoot 'updater.log'),(($lines -join "`n")+"`n"),[Text.UTF8Encoding]::new($false)) }
            $label = @{archive='Archive';coordinator='Coordinator';enroll='Enrollment'}[$suite]
            $summaries = @($lines | Where-Object { $_ -cmatch ('^' + $label + ' assertions: [1-9][0-9]* passed; 0 failed$') })
            $allSummaries = @($lines | Where-Object { $_ -cmatch ('^' + $label + ' assertions:') })
            if ($summaries.Count -ne 1 -or $allSummaries.Count -ne 1) { throw 'PowerShell updater suite did not prove successful executed assertions' }
          }
          $global:LASTEXITCODE = 0

      - name: Verify overlay round-trip
        run: |
          $ErrorActionPreference = 'Stop'
          $overlayFile = Join-Path (Get-Location) 'codexs/upstream/overlay.json'
          $patchFile = Join-Path (Get-Location) 'codexs/upstream/overlay.patch'
          $overlay = Get-Content -LiteralPath $overlayFile -Raw | ConvertFrom-Json
          if ($overlay.schema -ne 1 -or $overlay.base_sha -cnotmatch '^[a-f0-9]{40}$' -or
              $overlay.accepted_sha -cnotmatch '^[a-f0-9]{40}$' -or $overlay.patch_sha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'OVERLAY_IDENTITY' }
          if ((Get-FileHash -LiteralPath $patchFile -Algorithm SHA256).Hash.ToLowerInvariant() -cne $overlay.patch_sha256) { throw 'OVERLAY_HASH' }
          $expected = @($overlay.paths)
          if ($expected.Count -lt 1 -or $expected.Count -gt 1000) { throw 'OVERLAY_PATHS' }
          foreach ($name in $expected) {
            if ($name -isnot [string] -or $name -cnotmatch '^codex-rs/[A-Za-z0-9_./-]+$' -or
                $name -match '(^|/)\.\.(/|$)|\.snap(?:\.new)?$|\.pending-snap$') { throw 'OVERLAY_PATHS' }
          }
          if (@($expected | Sort-Object -Unique).Count -ne $expected.Count) { throw 'OVERLAY_PATHS' }
          $owned = Join-Path $env:RUNNER_TEMP ('codexs-overlay-' + [guid]::NewGuid().ToString('N'))
          $null = [IO.Directory]::CreateDirectory($owned)
          try {
            foreach ($item in @(Get-ChildItem Env:GIT_*)) { Remove-Item -LiteralPath ('Env:' + $item.Name) }
            $env:GIT_CONFIG_NOSYSTEM = '1'
            $env:GIT_TERMINAL_PROMPT = '0'
            $env:GIT_CONFIG_GLOBAL = Join-Path $owned 'empty-config'
            [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
            function Invoke-OverlayGit([string[]]$Arguments) {
              $ErrorActionPreference = 'Continue'
              $output = @(& git -c core.longpaths=true -c core.autocrlf=false -C $owned @Arguments 2>&1 | ForEach-Object { "$_" })
              $code = $LASTEXITCODE
              if ($null -eq $code -or $code -ne 0) { throw ('OVERLAY_GIT_' + $Arguments[0]) }
              return $output
            }
            $null = Invoke-OverlayGit @('init','--bare','--quiet')
            $null = Invoke-OverlayGit @('fetch','--quiet','--no-tags','--depth=1','https://github.com/TK-06/codexs.git',$overlay.base_sha,$overlay.accepted_sha)
            $null = Invoke-OverlayGit @('read-tree',$overlay.base_sha)
            $null = Invoke-OverlayGit @('apply','--cached','--whitespace=nowarn','--',$patchFile)
            $null = Invoke-OverlayGit @('diff','--cached','--exit-code',$overlay.accepted_sha,'--','codex-rs')
            $actual = @(Invoke-OverlayGit @('diff','--cached','--name-only',$overlay.base_sha))
            if ($actual.Count -ne $expected.Count -or @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual -CaseSensitive).Count -ne 0) { throw 'OVERLAY_PATHS' }
            Write-Host "overlay_roundtrip=ok base=$($overlay.base_sha) native=$($overlay.accepted_sha) paths=$($actual.Count) patch_sha256=$($overlay.patch_sha256)"
          } finally {
            $full = [IO.Path]::GetFullPath($owned)
            $prefix = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not $full.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($full) -notmatch '^codexs-overlay-[a-f0-9]{32}$') { throw 'OVERLAY_CLEANUP' }
            Remove-Item -LiteralPath $full -Recurse -Force
          }
          $global:LASTEXITCODE = 0

      - name: Check status-line Rust formatting
        env:
          FORMAT_CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $explicit = -not [string]::IsNullOrEmpty($env:FORMAT_CANDIDATE_SHA)
          $nativeRoot = if ($explicit) { 'candidate-format/codex-rs' } else { 'codex-rs' }
          if ($explicit) {
            if ($env:FORMAT_CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid formatting candidate identity' }
            $sha = & git -C candidate-format rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $sha -cne $env:FORMAT_CANDIDATE_SHA) { throw 'Formatting checkout does not match validated candidate' }
          }
          Set-Location -LiteralPath $nativeRoot
          $files = @(
            'tui/src/status_line_command.rs',
            'tui/src/status_line_command_tests.rs',
            'tui/src/chatwidget/status_line_command_glue.rs',
            'tui/src/chatwidget/status_line_command_integration_tests.rs',
            'tui/src/status_line_command_smoke.rs'
          )
          if ($explicit) {
            foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Missing required candidate status-line source' } }
          } else {
            if (-not (Test-Path -LiteralPath 'tui/src/status_line_command_smoke.rs' -PathType Leaf)) { Write-Host 'Legacy formatting: diagnostic source unavailable; explicit candidate validation required' }
            $files = @($files | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          }
          if (@($files).Count -eq 0) { throw 'No status-line source files found' }
          & rustup run 1.95.0 rustfmt --edition 2024 --check @files
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { throw "Status-line formatting failed: $nativeExit" }

      - name: Record complete acceptance
        if: contains(fromJSON('["formatter","bundle","evidence"]'), inputs.scope)
        run: |
          $ErrorActionPreference='Stop'
          $env:CODEXS_QUICK_LOG_ROOT=Join-Path $env:RUNNER_TEMP "codexs-task9-quick-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $entry=Join-Path $env:RUNNER_TEMP "codexs-task9-quick-record-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.cjs"
          $program=@'
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const {createAcceptanceReceipt}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/release/evidence.cjs'));
          const {encodeRelease}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/update/protocol.cjs'));
          try {
            const root=process.env.CODEXS_QUICK_LOG_ROOT;
            const files=new Map(['quick.log','installer.log','updater.log'].map(name=>[name,fs.readFileSync(path.join(root,name))]));
            const receipt=createAcceptanceReceipt({scope:'quick',candidate:{sha:process.env.CODEXS_NATIVE_SHA,upstream_sha:process.env.CODEXS_UPSTREAM_SHA,version:process.env.CODEXS_SOURCE_VERSION},formatter:{sha:process.env.CODEXS_FORMATTER_SHA,version:process.env.CODEXS_FORMATTER_VERSION},controller_sha:process.env.GITHUB_SHA,files});
            fs.writeFileSync(path.join(root,'acceptance.json'),encodeRelease(receipt),{flag:'wx'});
            console.log('codexs quick acceptance recorded');
          } catch(error) {console.error('codexs: '+(error&&/^[A-Z][A-Z0-9_]{0,63}$/.test(error.code)?error.code:'EVIDENCE_IO'));process.exitCode=1;}
          '@
          [IO.File]::WriteAllText($entry,$program,[Text.UTF8Encoding]::new($false))
          & node $entry
          if ($LASTEXITCODE -ne 0) { throw 'Quick acceptance did not complete' }

      - name: Upload quick acceptance
        if: always() && contains(fromJSON('["formatter","bundle","evidence"]'), inputs.scope)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-task9-quick-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexs-task9-quick-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  formatter_acceptance:
    name: Pinned formatter acceptance
    if: inputs.scope == 'formatter'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CODEXS_NATIVE_SHA: ${{ inputs.candidate_sha }}
      CODEXS_UPSTREAM_SHA: ${{ inputs.baseline_sha }}
      CODEXS_FORMATTER_SHA: ${{ inputs.formatter_sha }}
      CODEXS_FORMATTER_VERSION: ${{ inputs.formatter_version }}
      CODEXS_SOURCE_VERSION: ${{ inputs.source_version }}
    steps:
      - name: Checkout formatter controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout pinned formatter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TK-06/ccstatusline
          ref: ${{ inputs.formatter_sha }}
          path: formatter-source
          persist-credentials: false

      - name: Install formatter Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned formatter Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'

      - name: Build and test pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/formatter-source"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$CODEXS_FORMATTER_SHA"
          test "$(bun --version)" = '1.4.5'
          logs="$RUNNER_TEMP/codexs-task9-formatter-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -- "$logs"
          cd -- "$source_root"
          bun install --frozen-lockfile --ignore-scripts 2>&1 | tee "$logs/install.log"
          bun run lint 2>&1 | tee "$logs/lint.log"
          printf 'lint_exit=0\n' > "$logs/checks.log"
          bun test 2>&1 | tee "$logs/tests.log"
          bun run build 2>&1 | tee "$logs/build.log"
          printf 'build_exit=0\n' >> "$logs/checks.log"
          test -f dist/ccstatusline.js
          git -C "$source_root" diff --exit-code -- .

      - name: Record complete acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const root=process.env.GITHUB_WORKSPACE;
          const {createAcceptanceReceipt}=require(path.join(root,'codexs/release/evidence.cjs'));
          const {encodeRelease}=require(path.join(root,'codexs/update/protocol.cjs'));
          try {
            const logs=path.join(process.env.RUNNER_TEMP,'codexs-task9-formatter-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);
            const metadata=JSON.parse(fs.readFileSync(path.join(root,'formatter-source/package.json'),'utf8'));
            if(metadata.name!=='ccstatusline'||metadata.type!=='module'||metadata.version!==process.env.CODEXS_FORMATTER_VERSION)throw Error('FORMATTER_METADATA');
            const files=new Map(['tests.log','checks.log'].map(name=>[name,fs.readFileSync(path.join(logs,name))]));
            const receipt=createAcceptanceReceipt({scope:'formatter',candidate:{sha:process.env.CODEXS_NATIVE_SHA,upstream_sha:process.env.CODEXS_UPSTREAM_SHA,version:process.env.CODEXS_SOURCE_VERSION},formatter:{sha:process.env.CODEXS_FORMATTER_SHA,version:metadata.version},controller_sha:process.env.GITHUB_SHA,files});
            fs.writeFileSync(path.join(logs,'acceptance.json'),encodeRelease(receipt),{flag:'wx'});
            console.log('codexs formatter acceptance recorded');
          } catch(error) {console.error('codexs: '+(error&&/^[A-Z][A-Z0-9_]{0,63}$/.test(error.code)?error.code:'EVIDENCE_IO'));process.exitCode=1;}
          NODE

      - name: Upload formatter acceptance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-task9-formatter-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexs-task9-formatter-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete formatter distribution
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-formatter-dist-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            formatter-source/dist/
            formatter-source/package.json
            formatter-source/LICENSE
          if-no-files-found: error
          retention-days: 14

  bundle_acceptance:
    name: Extracted Windows bundle acceptance
    if: inputs.scope == 'bundle'
    needs: [plan, quick_checks]
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: powershell
    env:
      CODEXS_NATIVE_SHA: ${{ inputs.candidate_sha }}
      CODEXS_UPSTREAM_SHA: ${{ inputs.baseline_sha }}
      CODEXS_FORMATTER_SHA: ${{ inputs.formatter_sha }}
      CODEXS_FORMATTER_VERSION: ${{ inputs.formatter_version }}
      CODEXS_SOURCE_VERSION: ${{ inputs.source_version }}
      CODEXS_PRODUCT_VERSION: ${{ inputs.product_version }}
      CODEXS_EVIDENCE_REQUEST: ${{ inputs.evidence_request }}
    steps:
      - name: Checkout bundle controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout pinned native licenses
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: native-source

      - name: Install bundle Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare verified bundle inputs
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $program=@'
          'use strict';
          const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
          const root=process.env.GITHUB_WORKSPACE;
          const {collectPreBundleEvidence,createGithubClient,downloadDistributionArtifact}=require(path.join(root,'codexs/release/evidence.cjs'));
          const {assembleBundle,assembleEnrollmentPackage,prepareNativeTree,fetchOfficialPackages}=require(path.join(root,'codexs/release/package.cjs'));
          const {encodeRelease}=require(path.join(root,'codexs/update/protocol.cjs'));
          const {resolveOwned}=require(path.join(root,'codexs/update/paths.cjs'));
          (async()=>{
            const request=JSON.parse(process.env.CODEXS_EVIDENCE_REQUEST);
            const candidate={sha:process.env.CODEXS_NATIVE_SHA,upstream_sha:process.env.CODEXS_UPSTREAM_SHA,version:process.env.CODEXS_SOURCE_VERSION};
            const formatter={sha:process.env.CODEXS_FORMATTER_SHA,version:process.env.CODEXS_FORMATTER_VERSION};
            const github=createGithubClient({token:process.env.GH_TOKEN,controllerSha:process.env.GITHUB_SHA});
            const preBundleEvidence=await collectPreBundleEvidence({candidate,formatter,runs:request.runs},github);
            const build=request.runs.find(ref=>ref.scope==='build'),format=request.runs.find(ref=>ref.scope==='formatter');
            const native=await downloadDistributionArtifact({ref:build,kind:'native',artifact:build.binary_artifact},github);
            const formatted=await downloadDistributionArtifact({ref:format,kind:'formatter',artifact:request.formatter_artifact},github);
            delete process.env.GH_TOKEN;delete process.env.GITHUB_TOKEN;
            const parent=await fs.realpath(process.env.RUNNER_TEMP),work=await fs.mkdtemp(path.join(parent,'cx9-'));
            const bundleInputs={pre_evidence_sha256:crypto.createHash('sha256').update(encodeRelease(preBundleEvidence)).digest('hex'),formatter_artifact:{repository:format.repository,run:format.run,attempt:format.attempt,job:format.job,artifact:request.formatter_artifact}};
            await fs.writeFile(resolveOwned(work,'bundle-inputs.json'),encodeRelease(bundleInputs),{flag:'wx'});
            const packages=await fetchOfficialPackages(candidate.version,resolveOwned(work,'packages'));
            const nativeTree=await prepareNativeTree({candidate,...packages,native:native.get('codex.exe'),license:await fs.readFile(path.join(root,'native-source/LICENSE')),notice:await fs.readFile(path.join(root,'native-source/NOTICE'))},resolveOwned(work,'native-inputs'));
            nativeTree.productVersion=process.env.CODEXS_PRODUCT_VERSION;
            const formatterRoot=resolveOwned(work,'formatter-inputs');await fs.mkdir(formatterRoot);
            for(const [name,bytes]of formatted){const file=resolveOwned(formatterRoot,name);await fs.mkdir(path.dirname(file),{recursive:true});await fs.writeFile(file,bytes,{flag:'wx'});}
            const metadata=JSON.parse(await fs.readFile(path.join(root,'codexs/upstream/overlay.json'),'utf8'));
            if(crypto.createHash('sha256').update(await fs.readFile(path.join(root,'codexs/upstream/overlay.patch'))).digest('hex')!==metadata.patch_sha256)throw Error('OVERLAY_HASH');
            const draft=await assembleBundle({nativeTree,formatterDist:resolveOwned(formatterRoot,'dist'),formatterPackage:{path:resolveOwned(formatterRoot,'package.json'),...formatter},overlay:{sha:process.env.GITHUB_SHA,metadata},preBundleEvidence},resolveOwned(work,'output'));
            const enrollment=await assembleEnrollmentPackage({controllerSha:process.env.GITHUB_SHA},resolveOwned(work,'enrollment'));
            const exportRoot=resolveOwned(work,'export');await fs.mkdir(exportRoot);
            await fs.copyFile(draft.archivePath,path.join(exportRoot,'codexs-windows-x64.zip'),require('node:fs').constants.COPYFILE_EXCL);
            await fs.copyFile(enrollment.archivePath,resolveOwned(exportRoot,'codexs-enrollment.zip'),require('node:fs').constants.COPYFILE_EXCL);
            await fs.writeFile(resolveOwned(exportRoot,'manifest-base.json'),encodeRelease(draft.manifestBase),{flag:'wx'});
            const enrollmentMetadata={controller_sha:enrollment.controller_sha,files:enrollment.files,bytes:enrollment.bytes,sha256:enrollment.sha256};
            await fs.writeFile(resolveOwned(exportRoot,'enrollment.json'),encodeRelease(enrollmentMetadata),{flag:'wx'});
            await fs.writeFile(resolveOwned(work,'pre-bundle.json'),encodeRelease(preBundleEvidence),{flag:'wx'});
            await fs.appendFile(process.env.GITHUB_OUTPUT,'draft_path='+exportRoot+'\nwork_path='+work+'\n');
            await fs.appendFile(process.env.GITHUB_ENV,'CODEXS_BUNDLE_DRAFT='+exportRoot+'\nCODEXS_BUNDLE_WORK='+work+'\n');
            console.log('codexs complete bundle draft prepared');
          })().catch(error=>{console.error('codexs: '+(error&&/^[A-Z][A-Z0-9_]{0,63}$/.test(error.code)?error.code:'PACKAGE_IO'));process.exitCode=1;});
          '@
          $program | & node -
          if($LASTEXITCODE -ne 0){throw 'Verified bundle preparation failed'}

      - name: Test extracted distribution outside source checkouts
        run: |
          $ErrorActionPreference='Stop'
          $program=@'
          'use strict';
          const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const {promisify}=require('node:util'),exec=promisify(require('node:child_process').execFile);
          const root=process.env.GITHUB_WORKSPACE,work=process.env.CODEXS_BUNDLE_WORK,draft=process.env.CODEXS_BUNDLE_DRAFT;
          const {encodeRelease}=require(path.join(root,'codexs/update/protocol.cjs'));
          const {resolveOwned,verifyInventory,hashFile}=require(path.join(root,'codexs/update/paths.cjs'));
          let passed=0,phase='setup';
          (async()=>{
            const isolated=resolveOwned(work,'acceptance');await fs.mkdir(isolated);
            const logs=resolveOwned(work,'logs');await fs.mkdir(logs);
            phase='bundle-hash';
            const manifestBase=JSON.parse(await fs.readFile(path.join(draft,'manifest-base.json'),'utf8'));
            assert.equal(await hashFile(path.join(draft,'codexs-windows-x64.zip'),manifestBase.archive.bytes,'BUNDLE_HASH'),manifestBase.archive.sha256);passed++;
            phase='enrollment-hash';
            const enrollment=JSON.parse(await fs.readFile(path.join(draft,'enrollment.json'),'utf8'));
            assert.equal(enrollment.controller_sha,process.env.GITHUB_SHA);
            assert.equal(await hashFile(path.join(draft,'codexs-enrollment.zip'),enrollment.bytes,'BUNDLE_HASH'),enrollment.sha256);passed++;
            const inventory=resolveOwned(isolated,'enrollment-inventory.json');await fs.writeFile(inventory,encodeRelease(enrollment.files),{flag:'wx'});
            const extracted=resolveOwned(isolated,'enrollment'),shell=path.join(process.env.SystemRoot,'System32/WindowsPowerShell/v1.0/powershell.exe');
            const run=(file,args,options={})=>{
              const {input,...settings}=options;
              const operation=exec(file,args,{cwd:isolated,windowsHide:true,timeout:120000,maxBuffer:65536,...settings});
              operation.child.stdin.end(input);
              return operation;
            };
            const ps=async(program,env={})=>run(shell,['-NoProfile','-NonInteractive','-OutputFormat','Text','-EncodedCommand',Buffer.from("$ProgressPreference='SilentlyContinue';"+program,'utf16le').toString('base64')],{env:{...process.env,...env}});
            const extractData=Buffer.from(JSON.stringify({script:path.join(root,'codexs/update/archive.ps1'),archive:path.join(draft,'codexs-enrollment.zip'),destination:extracted,inventory,root:work})).toString('base64');
            phase='enrollment-extraction';
            await ps("$ErrorActionPreference='Stop';$d=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('"+extractData+"'))|ConvertFrom-Json;& ([scriptblock]::Create([IO.File]::ReadAllText($d.script))) -Archive $d.archive -Destination $d.destination -Inventory $d.inventory -AllowedRoot $d.root");
            await verifyInventory(extracted,enrollment.files);passed++;
            phase='synthetic-settings';
            const settings=resolveOwned(isolated,'settings.json'),settingsBytes=encodeRelease({version:4,colorLevel:0,lines:[[{id:'one',type:'custom-text',customText:'synthetic footer'}]],unknown_future:{keep:true}});
            await fs.writeFile(settings,settingsBytes,{flag:'wx'});
            const home=resolveOwned(isolated,'home');await fs.mkdir(home);
            const sentinels=['.claude/settings.json','.claude/.credentials.json','.codex/auth.json','.codex/history.jsonl'];
            for(const name of sentinels){const file=resolveOwned(home,name);await fs.mkdir(path.dirname(file),{recursive:true});await fs.writeFile(file,'synthetic untouched sentinel',{flag:'wx'});}
            // This key and provisional envelope exist only in owned test scratch.
            // Actual bundle totals come from this job after it completes, in a separate run.
            phase='test-envelope';
            const pre=JSON.parse(await fs.readFile(resolveOwned(work,'pre-bundle.json'),'utf8'));
            const evidence={...pre,suites:{...pre.suites,bundle:{passed:1,failed:0,ignored:0,exit:0}}};
            const manifest={...manifestBase,sequence:1,release_id:'codexs-v'+manifestBase.product_version+'-codex'+manifestBase.upstream.version+'-r1',evidence};
            const keys=crypto.generateKeyPairSync('ed25519'),manifestBytes=encodeRelease(manifest);
            const manifestPath=path.join(isolated,'release.json'),signaturePath=path.join(isolated,'release.sig'),keyPath=resolveOwned(isolated,'test-public-key.pem');
            await fs.writeFile(manifestPath,manifestBytes,{flag:'wx'});await fs.writeFile(signaturePath,crypto.sign(null,Buffer.concat([Buffer.from('codexs-release-v1\0'),manifestBytes]),keys.privateKey),{flag:'wx'});
            await fs.writeFile(keyPath,keys.publicKey.export({type:'spki',format:'pem'}),{flag:'wx'});
            const options={AllowedRoot:isolated,InstallRoot:resolveOwned(isolated,'installed'),AllowedShimRoot:isolated,ShimRoot:resolveOwned(isolated,'shims'),PackageRoot:resolveOwned(extracted,'update'),Bundle:path.join(draft,'codexs-windows-x64.zip'),Manifest:manifestPath,Signature:signaturePath,PublicKey:keyPath,NodePath:process.execPath,SettingsPath:settings};
            const data=Buffer.from(JSON.stringify(options)).toString('base64');
            const code="$ErrorActionPreference='Stop';$d=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('"+data+"'))|ConvertFrom-Json;$options=@{};foreach($p in $d.PSObject.Properties){$options[$p.Name]=$p.Value};. ([scriptblock]::Create([IO.File]::ReadAllText((Join-Path $d.PackageRoot 'enroll.ps1'))));$r=Invoke-CodexsEnrollmentCore $options (Get-CodexsEnrollmentOperations) -Install;if(-not $r.Installed){throw 'BUNDLE_ENROLLMENT'};[Console]::Out.WriteLine('BUNDLE_ENROLLED')";
            phase='enrollment';
            const installed=await ps(code,{HOME:home,USERPROFILE:home,CODEX_HOME:resolveOwned(home,'.codex'),LOCALAPPDATA:home,APPDATA:home,TEMP:isolated,TMP:isolated});
            phase='enrollment-receipt';
            assert.equal(installed.stdout.trim(),'BUNDLE_ENROLLED');passed++;
            const installedRoot=options.InstallRoot,versionDir=resolveOwned(installedRoot,'versions/'+manifest.release_id);
            phase='installed-inventory';
            await verifyInventory(versionDir,manifest.files,{installed:true});passed++;
            const cleanEnv={SystemRoot:process.env.SystemRoot,WINDIR:process.env.SystemRoot,COMSPEC:path.join(process.env.SystemRoot,'System32/cmd.exe'),PATH:path.join(process.env.SystemRoot,'System32'),HOME:home,USERPROFILE:home,CODEX_HOME:resolveOwned(home,'.codex'),LOCALAPPDATA:home,APPDATA:home,TEMP:isolated,TMP:isolated,NO_COLOR:'1',CCSTATUSLINE_WIDTH:'80'};
            const native=resolveOwned(versionDir,'bin/codex.exe'),formatter=resolveOwned(versionDir,'formatter/dist/ccstatusline.js');
            phase='native-smoke';
            const smoke=await run(native,['codexs-smoke','--node',process.execPath,'--formatter',formatter],{env:cleanEnv});
            assert.equal(smoke.stderr,'');assert.equal(smoke.stdout.trim(),'{"schema":1,"runner":"ok","formatter":"ok","cleanup":"ok"}');passed++;
            for(const [name,expected]of [['codexs','codexs '+manifest.product_version+' (Codex CLI '+manifest.upstream.version+')'],['codexs-statusline','codexs-statusline '+manifest.product_version]]){
              for(const extension of ['ps1','cmd']){
                phase=name+'-'+extension+'-version';
                const shim=resolveOwned(options.ShimRoot,name+'.'+extension);
                const result=await ps("$ErrorActionPreference='Stop';& $env:CODEXS_TEST_SHIM --version;if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}",{...cleanEnv,CODEXS_TEST_SHIM:shim});
                assert.equal(result.stderr,'');assert.equal(result.stdout.trim(),expected);passed++;
              }
            }
            phase='formatter-privacy-setup';
            const guard=resolveOwned(isolated,'privacy-guard.cjs'),witness=resolveOwned(isolated,'privacy-attempts.txt');
            cleanEnv.CODEXS_PRIVACY_WITNESS=witness;
            await fs.writeFile(guard,[
              "'use strict';const fs=require('node:fs');",
              "const blocked=kind=>{fs.appendFileSync(process.env.CODEXS_PRIVACY_WITNESS,kind+'\\n');throw Error('BUNDLE_PRIVACY');};",
              "const deny=value=>{if(typeof value==='string'&&(/(?:^|[\\\\/])\\.claude(?:[\\\\/]|$)/i.test(value)||value.includes('denied-transcript')))blocked('read');};",
              "for(const name of ['readFile','readFileSync','open','openSync','stat','statSync','lstat','lstatSync','access','accessSync','readdir','readdirSync','existsSync']){const fn=fs[name];if(fn)fs[name]=function(file,...args){deny(file);return fn.call(this,file,...args);};}",
              "for(const name of ['readFile','open','stat','lstat','access','readdir']){const fn=fs.promises[name];fs.promises[name]=function(file,...args){deny(file);return fn.call(this,file,...args);};}",
              "for(const module of ['node:http','node:https'])for(const method of ['get','request'])require(module)[method]=()=>blocked('network');",
              "for(const method of ['connect','createConnection'])require('node:net')[method]=()=>blocked('network');require('node:net').Socket.prototype.connect=()=>blocked('network');globalThis.fetch=()=>blocked('network');require('node:module').syncBuiltinESMExports();",
            ].join('\n'),{flag:'wx'});
            const renderConfig=resolveOwned(isolated,'render.json');
            const marker='synthetic-footer-abcdefghijklmnopqrstuvwxyz';
            await fs.writeFile(renderConfig,encodeRelease({version:4,colorLevel:0,flexMode:'full',lines:[[{id:'one',type:'custom-text',customText:marker}]]}),{flag:'wx'});
            const payload=JSON.stringify({codex:{schema:1},transcript_path:resolveOwned(home,'denied-transcript.jsonl')});
            for(const width of [12,80]){
              phase='formatter-width-'+width;
              const result=await run(process.execPath,['--require',guard,formatter,'--config',renderConfig],{env:{...cleanEnv,CCSTATUSLINE_WIDTH:String(width)},input:payload});
              const visible=result.stdout.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,'').trimEnd();
              assert.equal(result.stderr,'');assert.ok(visible.length>0&&visible.length<=width);
              assert.equal(await fs.stat(witness).catch(error=>{if(error.code==='ENOENT')return null;throw error;}),null,'formatter attempted prohibited I/O');
              if(width===80)assert.equal(visible.trim(),marker);passed++;
            }
            phase='settings-preserved';
            assert.deepEqual(await fs.readFile(settings),settingsBytes);passed++;
            phase='sentinels-preserved';
            for(const name of sentinels)assert.equal(await fs.readFile(resolveOwned(home,name),'utf8'),'synthetic untouched sentinel');passed++;
            phase='final-inventory';
            await verifyInventory(versionDir,manifest.files,{installed:true});passed++;
            phase='acceptance-log';
            await fs.writeFile(resolveOwned(logs,'bundle.log'),'Bundle assertions: '+passed+' passed; 0 failed\n',{flag:'wx'});
            console.log('codexs extracted bundle acceptance passed');
          })().catch(async error=>{
            // Retain only reviewed codes and scalar diagnostics, never child output or paths.
            const codes=new Set(('ERR_ASSERTION ERR_CHILD_PROCESS_STDIO_MAXBUFFER ENOENT EACCES EPERM EEXIST BUNDLE_HASH BUNDLE_ENROLLMENT SIGNATURE MANIFEST_SCHEMA MANIFEST_MISMATCH COMPATIBILITY LOW_DISK SETTINGS_HOLD PATH DOWNLOAD_HASH ARCHIVE_REJECTED EXTRACT_IO COORDINATOR_REQUIRED COORDINATOR_PROTOCOL COORDINATOR_TIMEOUT COORDINATOR_WORKER ENROLL_PATH ENROLL_NODE ENROLL_INPUT ENROLL_PACKAGE ENROLL_VERIFY ENROLL_PROTOCOL ENROLL_CONFIG ENROLL_RECOVERY_REQUIRED ENROLL_OWNER ENROLL_BUSY ENROLL_IO ENROLL_SHIM_OWNER ENROLL_SHIM_VERIFY ENROLL_EXISTS ENROLL_RUNNING ENROLL_MISMATCH ENROLL_FAILED STATE_SCHEMA STATE_COMMIT STAGE_IO STAGE_INVENTORY STAGE_PACKAGE STAGE_ARCHITECTURE STAGE_VERSION STAGE_PROBE_REQUIRED STAGE_CONFLICT STAGE_EXTRACT_REQUIRED SMOKE_ARGS SMOKE_IO SMOKE_ENV SMOKE_TIMEOUT SMOKE_OUTPUT SMOKE_CANCELLED SMOKE_RUNNER SMOKE_PROTOCOL SMOKE_RUNNER_CLEANUP SMOKE_DIRECTORY_CLEANUP SMOKE_RUNNER_AND_DIRECTORY_CLEANUP SMOKE_CLEANUP SMOKE_UNSUPPORTED SMOKE_RUNTIME').split(' '));
            const stdout=typeof error?.stdout==='string'||Buffer.isBuffer(error?.stdout)?error.stdout:'',stderr=typeof error?.stderr==='string'||Buffer.isBuffer(error?.stderr)?error.stderr:'';
            const output=String(stderr).slice(0,65536).replace(/_x000D_/g,'\r').replace(/_x000A_/g,'\n').replace(/<\/?(?:Objs|S)(?:\s[^<>]{0,512})?>/g,'');
            const reported=[...output.matchAll(/(?:^|\r?\n)\s*(?:(?:\+\s*)?FullyQualifiedErrorId\s*:\s*|Error: |codexs: )?([A-Z][A-Z0-9_]{0,63})\s*(?=\r?\n|$)/g)].map(match=>match[1]).find(code=>codes.has(code));
            const childExit=Number.isSafeInteger(error?.code)?error.code:null;
            const code=codes.has(error?.code)?error.code:reported||(childExit===null?'BUNDLE_FAILED':'BUNDLE_CHILD_EXIT');
            const failure={schema:1,phase,code,child_exit:childExit,killed:error?.killed===true,stdout_bytes:Buffer.byteLength(stdout),stderr_bytes:Buffer.byteLength(stderr),passed};
            console.error('codexs: '+code);console.error('codexs bundle diagnostic: '+JSON.stringify(failure));process.exitCode=1;
            try{
              const logs=resolveOwned(work,'logs');await fs.mkdir(logs,{recursive:true});
              await fs.writeFile(resolveOwned(logs,'bundle.log'),'Bundle assertions: '+passed+' passed; 1 failed\n',{flag:'wx'}).catch(()=>{});
              await fs.writeFile(resolveOwned(logs,'failure.json'),encodeRelease(failure),{flag:'wx'});
            }catch{}
          });
          '@
          $program | & node -
          if($LASTEXITCODE -ne 0){throw 'Extracted bundle acceptance failed'}

      - name: Record complete acceptance
        run: |
          $ErrorActionPreference='Stop'
          $program=@'
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const {createAcceptanceReceipt}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/release/evidence.cjs'));
          const {encodeRelease}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/update/protocol.cjs'));
          try {
            const base=JSON.parse(fs.readFileSync(path.join(process.env.CODEXS_BUNDLE_DRAFT,'manifest-base.json'),'utf8'));
            const logs=path.join(process.env.CODEXS_BUNDLE_WORK,'logs'),files=new Map([['bundle.log',fs.readFileSync(path.join(logs,'bundle.log'))]]);
            const bundleInputs=JSON.parse(fs.readFileSync(path.join(process.env.CODEXS_BUNDLE_WORK,'bundle-inputs.json'),'utf8'));
            const receipt=createAcceptanceReceipt({scope:'bundle',candidate:{sha:process.env.CODEXS_NATIVE_SHA,upstream_sha:process.env.CODEXS_UPSTREAM_SHA,version:process.env.CODEXS_SOURCE_VERSION,archive:{bytes:base.archive.bytes,sha256:base.archive.sha256}},formatter:{sha:process.env.CODEXS_FORMATTER_SHA,version:process.env.CODEXS_FORMATTER_VERSION},controller_sha:process.env.GITHUB_SHA,files,bundleInputs});
            fs.writeFileSync(path.join(logs,'acceptance.json'),encodeRelease(receipt),{flag:'wx'});
            console.log('codexs bundle acceptance recorded');
          } catch(error){console.error('codexs: '+(error&&/^[A-Z][A-Z0-9_]{0,63}$/.test(error.code)?error.code:'EVIDENCE_IO'));process.exitCode=1;}
          '@
          $program | & node -
          if($LASTEXITCODE -ne 0){throw 'Bundle receipt failed'}

      - name: Upload bundle acceptance
        if: always() && steps.draft.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-task9-bundle-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.draft.outputs.work_path }}/logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload accepted bundle draft
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-bundle-draft-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.draft.outputs.draft_path }}/
          if-no-files-found: error
          retention-days: 14

  release_evidence:
    name: Complete release evidence
    if: inputs.scope == 'evidence'
    needs: [plan, quick_checks]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout evidence controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install evidence Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Collect completed exact-archive evidence
        id: evidence
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXS_NATIVE_SHA: ${{ inputs.candidate_sha }}
          CODEXS_UPSTREAM_SHA: ${{ inputs.baseline_sha }}
          CODEXS_FORMATTER_SHA: ${{ inputs.formatter_sha }}
          CODEXS_FORMATTER_VERSION: ${{ inputs.formatter_version }}
          CODEXS_SOURCE_VERSION: ${{ inputs.source_version }}
          CODEXS_PRODUCT_VERSION: ${{ inputs.product_version }}
          CODEXS_EVIDENCE_REQUEST: ${{ inputs.evidence_request }}
        run: |
          $ErrorActionPreference='Stop'
          $program=@'
          'use strict';
          const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
          const {collectEvidence,createGithubClient,downloadDistributionArtifact}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/release/evidence.cjs'));
          const {encodeRelease}=require(path.join(process.env.GITHUB_WORKSPACE,'codexs/update/protocol.cjs'));
          (async()=>{
            const request=JSON.parse(process.env.CODEXS_EVIDENCE_REQUEST),github=createGithubClient({token:process.env.GH_TOKEN,controllerSha:process.env.GITHUB_SHA});
            const ref=request.runs.find(ref=>ref.scope==='bundle');
            const files=await downloadDistributionArtifact({ref,kind:'bundle',artifact:request.bundle_artifact},github);
            const base=JSON.parse(files.get('manifest-base.json').toString('utf8')),archive=files.get('codexs-windows-x64.zip');
            if(base.archive.bytes!==archive.length||base.archive.sha256!==crypto.createHash('sha256').update(archive).digest('hex')||base.native_sha!==process.env.CODEXS_NATIVE_SHA||base.upstream.sha!==process.env.CODEXS_UPSTREAM_SHA||base.formatter.sha!==process.env.CODEXS_FORMATTER_SHA||base.upstream.version!==process.env.CODEXS_SOURCE_VERSION||base.formatter.version!==process.env.CODEXS_FORMATTER_VERSION||base.product_version!==process.env.CODEXS_PRODUCT_VERSION)throw Error('EVIDENCE_ARCHIVE');
            const candidate={sha:base.native_sha,upstream_sha:base.upstream.sha,version:base.upstream.version,archive:{bytes:base.archive.bytes,sha256:base.archive.sha256}};
            const formatter={sha:base.formatter.sha,version:base.formatter.version};
            const evidence=await collectEvidence({candidate,formatter,runs:request.runs},github);
            // Formatter distribution must still belong to its accepted completed job.
            await downloadDistributionArtifact({ref:request.runs.find(ref=>ref.scope==='formatter'),kind:'formatter',artifact:request.formatter_artifact},github);
            const format=request.runs.find(ref=>ref.scope==='formatter');
            if(!evidence.runs.some(selected=>selected.repository===format.repository&&selected.run===format.run&&selected.attempt===format.attempt&&selected.job===format.job&&selected.artifact===request.formatter_artifact))throw Error('EVIDENCE_BINDING');
            evidence.runs.push({repository:ref.repository,run:ref.run,attempt:ref.attempt,job:ref.job,artifact:request.bundle_artifact});
            delete process.env.GH_TOKEN;delete process.env.GITHUB_TOKEN;
            const output=path.join(process.env.RUNNER_TEMP,'codexs-task9-evidence-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);await fs.mkdir(output);
            await fs.writeFile(path.join(output,'evidence.json'),encodeRelease(evidence),{flag:'wx'});
            await fs.writeFile(path.join(output,'manifest-base.json'),encodeRelease(base),{flag:'wx'});
            await fs.writeFile(path.join(output,'archive.json'),encodeRelease(base.archive),{flag:'wx'});
            await fs.appendFile(process.env.GITHUB_OUTPUT,'evidence_path='+output+'\n');
            console.log('codexs completed exact-archive evidence collected');
          })().catch(error=>{console.error('codexs: '+(error&&/^[A-Z][A-Z0-9_]{0,63}$/.test(error.code)?error.code:'EVIDENCE_IO'));process.exitCode=1;});
          '@
          $program | & node -
          if($LASTEXITCODE -ne 0){throw 'Complete evidence collection failed'}

      - name: Upload complete evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-task9-evidence-${{ inputs.validation_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.evidence_path }}/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (${{ matrix.scope }})
    if: ${{ needs.plan.outputs.native_required == 'true' }}
    needs: [plan, quick_checks]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      # Keep nested dependency checkouts below the Windows legacy path limit.
      CARGO_HOME: 'D:\c'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      INSTA_UPDATE: 'no'
      CARGO_TERM_COLOR: 'never'
    steps:
      - name: Select validated scope
        id: scope
        env:
          MATRIX_SCOPE: ${{ matrix.scope }}
          CALLER_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CALLER_BASELINE_SHA: ${{ inputs.baseline_sha }}
          CALLER_VALIDATION_ID: ${{ inputs.validation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scope = $env:MATRIX_SCOPE
          if ($scope -cnotin @('feature', 'full', 'baseline', 'build', 'triage-full', 'triage-baseline', 'config', 'config-baseline')) { throw "Unsupported scope: $scope" }
          $hasCaller = -not [string]::IsNullOrEmpty($env:CALLER_CANDIDATE_SHA) -or -not [string]::IsNullOrEmpty($env:CALLER_BASELINE_SHA) -or -not [string]::IsNullOrEmpty($env:CALLER_VALIDATION_ID)
          if ($hasCaller) {
            if ($env:CALLER_CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:CALLER_BASELINE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid reusable source identity' }
            if ($env:CALLER_VALIDATION_ID -cnotmatch '^[a-z][a-z0-9-]{0,31}$') { throw 'Unsafe validation invocation identity' }
          }
          $baselineRef = if ($hasCaller) { $env:CALLER_BASELINE_SHA } else { '1ee2374c675b1aeae8ca76e1c6c75a6a62619f8e' }
          $candidateRef = if ($hasCaller) { $env:CALLER_CANDIDATE_SHA } else { $env:GITHUB_SHA }
          $sourceRef = if ($scope -cin @('baseline','triage-baseline','config-baseline')) { $baselineRef } else { $candidateRef }
          $suffix = if ($hasCaller) { "$env:CALLER_VALIDATION_ID-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" } else { "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" }
          $logDir = Join-Path $env:RUNNER_TEMP "codexs-statusline-$scope-$suffix"
          New-Item -ItemType Directory -Path $logDir -ErrorAction Stop | Out-Null
          "scope=$scope" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "source_ref=$sourceRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "artifact_suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "CODEXS_SCOPE=$scope" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "CODEXS_EXPECTED_SOURCE_SHA=$sourceRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "CODEXS_LOG_DIR=$logDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.scope.outputs.source_ref }}

      - name: Check hosted pagefile disk capacity
        run: |
          $ErrorActionPreference = 'Stop'
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ($null -eq $disk -or $disk.DeviceID -ine 'D:' -or $disk.DriveType -ne 3 -or $null -eq $disk.FreeSpace) { throw 'Hosted pagefile requires a readable fixed D: drive' }
          $free = [long]$disk.FreeSpace
          "pagefile_preflight disk=D: free_bytes=$free allocation_bytes=34359738368 reserve_bytes=8589934592" |
            Tee-Object -FilePath (Join-Path $env:CODEXS_LOG_DIR 'memory-capacity.log')
          if ($free -lt 40GB) { throw 'Hosted pagefile needs 32 GiB plus the 8 GiB disk reserve on D:' }

      - name: Configure hosted pagefile
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: 'D:'

      - name: Verify hosted memory capacity
        run: |
          $ErrorActionPreference = 'Stop'
          $pages = @(Get-CimInstance Win32_PageFileUsage -ErrorAction Stop | Where-Object { $_.Name -ieq 'D:\pagefile.sys' })
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $allocated = if ($pages.Count -eq 1) { [long]$pages[0].AllocatedBaseSize } else { 0 }
          $freeVirtual = [long]$os.FreeVirtualMemory * 1024
          $freePhysical = [long]$os.FreePhysicalMemory * 1024
          $totalVirtual = [long]$os.TotalVirtualMemorySize * 1024
          "pagefile_effective disk=D: allocated_mib=$allocated free_virtual_bytes=$freeVirtual free_physical_bytes=$freePhysical total_virtual_bytes=$totalVirtual" |
            Tee-Object -FilePath (Join-Path $env:CODEXS_LOG_DIR 'memory-capacity.log') -Append
          if ($allocated -lt 32768) { throw 'Effective D: pagefile is below the required 32 GiB' }
          if ($freePhysical -le 0 -or $totalVirtual -le 0 -or $freeVirtual -lt 24GB) { throw 'Hosted runner requires readable memory counters and at least 24 GiB of free virtual memory before Cargo' }

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Restore Cargo downloads only
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: codexs-windows-cargo-1.95.0-${{ hashFiles('codex-rs/Cargo.lock') }}

      - name: Verify source and select target drive
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $logDir = [System.IO.Path]::GetFullPath($env:CODEXS_LOG_DIR)
          $setupLog = Join-Path $logDir 'setup.log'
          "preflight_started scope=$env:CODEXS_SCOPE" | Out-File -LiteralPath $setupLog -Encoding utf8
          try {
            $sha = (& git rev-parse HEAD).Trim()
            $gitExit = $LASTEXITCODE
            if ($gitExit -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot verify source SHA' }
            if ($env:CODEXS_EXPECTED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $sha -cne $env:CODEXS_EXPECTED_SOURCE_SHA) { throw 'Checkout does not match the selected immutable source' }
            $manifest = Get-Content -LiteralPath Cargo.toml -Raw
            $packageSections = [regex]::Matches($manifest, '(?ms)^\[workspace\.package\]\s*\r?\n(?<section>.*?)(?=^\[|\z)')
            if ($packageSections.Count -ne 1) { throw 'Missing or ambiguous workspace package version' }
            $versionLines = @($packageSections[0].Groups['section'].Value -split '\r?\n' | Where-Object { $_ -cmatch '^version\s*=' })
            if ($versionLines.Count -ne 1 -or $versionLines[0] -cnotmatch '^version\s*=\s*"(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))"[ \t]*(?:#.*)?$') { throw 'Invalid stable workspace version' }
            $workspaceVersion = $Matches['version']
            if ($workspaceVersion -ceq '0.0.0') { throw 'Development workspace version is not release evidence' }
            $toolchain = Get-Content -LiteralPath rust-toolchain.toml -Raw
            $pinLines = @($toolchain -split '\r?\n' | Where-Object { $_ -cmatch '^\s*channel\s*=' })
            if ($pinLines.Count -ne 1 -or $pinLines[0] -cnotmatch '^\s*channel\s*=\s*"1\.95\.0"\s*$') { throw 'Unexpected source Rust pin' }
            $rustVersion = & rustup run 1.95.0 rustc --version
            $rustExit = $LASTEXITCODE
            if ($rustExit -ne 0 -or $rustVersion -notmatch '^rustc 1\.95\.0 ') { throw "Wrong Rust toolchain: $rustVersion (exit $rustExit)" }
            $drives = @([System.IO.DriveInfo]::GetDrives() | Where-Object { $_.DriveType -eq 'Fixed' -and $_.IsReady } | Sort-Object AvailableFreeSpace -Descending)
            if ($drives.Count -eq 0) { throw 'No readable fixed target drive' }
            $best = $drives[0]
            $target = Join-Path $best.RootDirectory.FullName "codexs-target-$env:CODEXS_SCOPE-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $target = [System.IO.Path]::GetFullPath($target)
            if ([System.IO.Path]::GetPathRoot($target) -cne $best.RootDirectory.FullName -or (Test-Path -LiteralPath $target)) { throw 'Target directory is not unique or on selected drive' }
            New-Item -ItemType Directory -Path $target -ErrorAction Stop | Out-Null
            "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CODEXS_SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            "CODEXS_WORKSPACE_VERSION=$workspaceVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            "source=$sha scope=$env:CODEXS_SCOPE rust=$rustVersion target=$target" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append
            foreach ($drive in $drives) { "drive=$($drive.Name) available_bytes=$($drive.AvailableFreeSpace)" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append }
          } catch {
            "PREFLIGHT_FAILED $($_.Exception.Message)" | Out-File -LiteralPath $setupLog -Encoding utf8 -Append
            throw
          }

      - name: Run guarded native Cargo operation
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CODEXS_SCOPE -cnotin @('feature', 'full', 'baseline', 'build', 'triage-full', 'triage-baseline', 'config', 'config-baseline')) { throw 'Invalid scope from selection step' }
          $logDir = [System.IO.Path]::GetFullPath($env:CODEXS_LOG_DIR)
          $guardPath = Join-Path $logDir 'resource-guard.ps1'
          $runnerPath = Join-Path $logDir 'cargo-runner.ps1'
          $statePath = Join-Path $logDir 'guard-state.json'
          $guardLog = Join-Path $logDir 'guard.log'
          $readyPath = Join-Path $logDir 'guard.ready'
          $requestPath = Join-Path $logDir 'start.request'
          $startedPath = Join-Path $logDir 'runner.started'
          $donePath = Join-Path $logDir 'guard.done'
          $stopPath = Join-Path $logDir 'guard.stop'
          $outPath = Join-Path $logDir 'cargo.log'
          $exitPath = Join-Path $logDir 'native-exit.txt'
          $runnerErrorPath = Join-Path $logDir 'runner-error.txt'
          $resultPath = Join-Path $logDir 'outcome.txt'
          $runnerSource = @'
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath $env:CODEXS_GUARD_STATE -Raw | ConvertFrom-Json
          function Invoke-CodexsSmokeGate {
            param([Parameter(Mandatory=$true)][string]$Binary)
            $node = (Get-Command node.exe -ErrorAction Stop).Source
            if (-not [IO.Path]::IsPathRooted($node) -or -not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'SMOKE_NODE_REQUIRED' }
